<style>
/* Fonts ship with the app (offline); the Google link above is a fallback for the web build. */
@font-face { font-family: "Lilita One"; src: url("lilitaone-latin.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Baloo 2"; src: url("baloo2-latin.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
/* Layout: full-screen 3D arena; HUD floats on top. Single bright "toy box" look in both themes. */
:root {
  --sky: #9cc9e8;
  --ink: #1d2b3a;
  --card: #ffffff;
  --card-ink: #1d2b3a;
  --accent: #ff8a3d;
  --go: #3fbf55;
  --warn: #ff4f6d;
  --muted: #6b7f92;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Baloo 2", ui-rounded, system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: none; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

.hud { position: fixed; left: 0; right: 0; pointer-events: none; display: flex; justify-content: space-between;
  align-items: flex-start; gap: 8px; padding-inline: 12px; flex-wrap: wrap; }
.hud > * { pointer-events: auto; }
.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
.bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); justify-content: center; }

.brand { font-family: var(--display); font-size: 22px; color: #fff; letter-spacing: .5px;
  text-shadow: 0 2px 0 #3b7fb0, 0 3px 8px rgba(0,0,0,.2); align-self: center; }

.tabs { display: flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.tabs button { font: 700 15px var(--body); border: 0; background: transparent; color: var(--muted);
  padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tabs button:disabled { opacity: .45; cursor: not-allowed; }

.panel { background: var(--card); color: var(--card-ink); border-radius: 16px; padding: 8px 12px;
  box-shadow: 0 3px 0 rgba(0,0,0,.15); font-size: 14px; line-height: 1.3; }
.check { display: flex; gap: 10px; flex-wrap: wrap; }
.check span::before { content: "○ "; color: var(--warn); font-weight: 700; }
.check span.ok::before { content: "● "; color: var(--go); }

.palette { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding: 6px; background: var(--card);
  border-radius: 18px; box-shadow: 0 3px 0 rgba(0,0,0,.15); scrollbar-width: none; }
.palette::-webkit-scrollbar { display: none; }
.slot { flex: 0 0 auto; width: 58px; border: 0; border-radius: 12px; background: #eef4f9; cursor: pointer;
  padding: 6px 2px 4px; font: 700 11px var(--body); color: var(--card-ink); display: grid; justify-items: center; gap: 2px; }
.slot i { width: 26px; height: 26px; border-radius: 7px; display: block; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.slot[aria-pressed="true"] { background: var(--ink); color: #fff; }
.slot.tool { background: #fff4ec; }
.slot.tool[aria-pressed="true"] { background: var(--accent); }
.sep { flex: 0 0 2px; background: #dde6ee; border-radius: 2px; margin: 4px 2px; }

.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.btn { font: 700 15px var(--body); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer;
  background: var(--card); color: var(--card-ink); box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.btn.primary { background: var(--go); color: #fff; box-shadow: 0 3px 0 #2a8a3c; }
.btn:focus-visible, .slot:focus-visible, .tabs button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.scores { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 4px 10px 4px 4px;
  font-weight: 700; box-shadow: 0 3px 0 rgba(0,0,0,.15); font-variant-numeric: tabular-nums; }
.chip b { width: 20px; height: 20px; border-radius: 50%; display: block; }
.chip.turn { outline: 3px solid var(--ink); }
.chip.done { opacity: .6; }

.toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); font-family: var(--display);
  font-size: clamp(28px, 8vw, 52px); color: #fff; text-shadow: 0 3px 0 #3b7fb0, 0 6px 14px rgba(0,0,0,.25);
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; padding-inline: 16px; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.sheet { position: fixed; inset: 0; display: flex; background: rgba(29,43,58,.35); padding: 16px; z-index: 15; overflow-y: auto; touch-action: pan-y; }
.sheet .panel { width: min(420px, 100%); padding: 18px; display: grid; gap: 12px; margin: auto; box-sizing: border-box; }
.sheet h2 { font: 400 26px var(--display); margin: 0; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); }
.sheet textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, Menlo, monospace; border-radius: 10px;
  border: 2px solid #dde6ee; padding: 8px; min-height: 64px; resize: vertical; color: var(--card-ink); background: #f6f9fc; -webkit-user-select: text; user-select: text; }
.count { display: flex; gap: 6px; }
.count button { flex: 1; font: 400 22px var(--display); border: 0; border-radius: 12px; padding: 10px 0; background: #eef4f9; color: var(--card-ink); cursor: pointer; }
.count button[aria-pressed="true"] { background: var(--ink); color: #fff; }
table.card { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.card td { padding: 6px 4px; border-bottom: 1px solid #e6edf3; }
table.card td:last-child { text-align: right; font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); text-align: center; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font: 400 28px var(--display); color: #fff; }

/* ---- In-game top bar ---- */
.homeBtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,.15); display: grid; place-items: center; flex: 0 0 auto; }
.homeBtn svg { width: 22px; height: 22px; }
.titlePill { font: 400 20px var(--display); color: #fff; letter-spacing: .3px; align-self: center;
  text-shadow: 0 2px 0 #3b7fb0, 0 3px 8px rgba(0,0,0,.2); flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlePill small { font: 700 13px var(--body); opacity: .9; margin-left: 6px; text-shadow: 0 1px 2px #0004; }

/* ---- Home screen: the game shelf ---- */
.home { position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  background: radial-gradient(120% 80% at 50% 0%, #bfe3fb 0%, #9cc9e8 55%, #86b9de 100%);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  transition: opacity .28s ease, transform .28s ease; }
.home.hidden { opacity: 0; transform: scale(1.04); pointer-events: none; }
.homeInner { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo .box { width: 52px; height: 52px; border-radius: 14px; background: #ff8a3d; box-shadow: inset 0 -6px 0 #d96a22, 0 4px 0 rgba(0,0,0,.15);
  display: block; object-fit: cover; flex: 0 0 auto; }
.logo h1 { margin: 0; font: 400 clamp(30px, 6vw, 44px)/1 var(--display); color: #fff; letter-spacing: .5px;
  text-shadow: 0 3px 0 #3b7fb0, 0 6px 14px rgba(0,0,0,.18); }
.logo p { margin: 2px 0 0; color: #1d2b3acc; font-weight: 700; }
.playersRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.playersRow span { font-weight: 700; color: var(--ink); }
.seg { display: flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.seg button { font: 400 18px var(--display); border: 0; background: transparent; color: var(--muted); width: 44px; height: 36px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.shelfLabel { font: 400 22px var(--display); color: var(--ink); margin: 4px 0 -6px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.gcard { position: relative; border: 0; padding: 0; text-align: left; cursor: pointer; border-radius: 22px; overflow: hidden;
  background: var(--card); box-shadow: 0 5px 0 rgba(0,0,0,.16); color: var(--card-ink); font-family: var(--body);
  transition: transform .15s ease, box-shadow .15s ease; display: grid; grid-template-rows: auto 1fr; }
.gcard:active { transform: translateY(3px) scale(.985); box-shadow: 0 2px 0 rgba(0,0,0,.16); }
.gcard:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
.gcard .art { aspect-ratio: 16 / 9; background: var(--tint, #5ccf4f); background-size: cover; background-position: center; position: relative; }
.gcard .tag { position: absolute; left: 10px; top: 10px; background: #fff; color: var(--ink); font: 700 12px var(--body);
  padding: 2px 9px; border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.gcard .meta { padding: 10px 14px 14px; display: grid; gap: 2px; }
.gcard h3 { margin: 0; font: 400 22px var(--display); }
.gcard p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.3; }
.gcard.soon { cursor: default; opacity: .62; }
.gcard.soon:active { transform: none; }
.dice { position: absolute; inset: 0; display: grid; place-items: center; }
.dice i { width: 74px; height: 74px; border-radius: 18px; background: #fff; box-shadow: inset 0 -6px 0 #dde6ee, 0 6px 0 rgba(0,0,0,.18);
  transform: rotate(-12deg); position: relative; display: block; }
.dice i + i { position: absolute; transform: translate(46px, 18px) rotate(14deg); }
.dice b { position: absolute; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); }

/* ---- Rule card (random games) ---- */
.rules { display: grid; gap: 8px; }
.rule { display: flex; gap: 10px; align-items: center; background: #f3f7fb; border-radius: 12px; padding: 8px 10px; }
.rule i { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto; display: grid; place-items: center; font: 400 18px var(--display); color: #fff; font-style: normal; }
.rule b { display: block; font-size: 15px; }
.rule span { color: var(--muted); font-size: 13px; }
.sheet .panel.pop { animation: pop .32s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---- Curtain for smooth switches ---- */
#curtain { position: fixed; inset: 0; background: #9cc9e8; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .22s ease;
  display: grid; place-items: center; font: 400 26px var(--display); color: #fff; text-shadow: 0 2px 0 #3b7fb0; }
#curtain.on { opacity: 1; pointer-events: auto; }
.inGameOnly.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { .toast, .home, #curtain, .gcard { transition: none; } .sheet .panel.pop { animation: none; } }
</style>

<script>
  // Show any crash on screen (there's no console in the app) so it can be screenshotted and fixed.
  (function () {
    const show = (msg) => {
      let el = document.getElementById("errBox");
      if (!el) { el = document.createElement("div"); el.id = "errBox";
        el.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#ff4f6d;color:#fff;font:12px ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:10px;white-space:pre-wrap;pointer-events:none";
        document.body.appendChild(el); }
      el.textContent = "Oops: " + msg;
    };
    addEventListener("error", (e) => show(`${e.message} (line ${e.lineno})`));
    addEventListener("unhandledrejection", (e) => show(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  })();
</script>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Constants. Grid conventions match docs/pieces.md: 2 m tiles, 1 m levels, +Y local = piece forward.
// Physics runs in "plane coords" (px, py) with py = -worldZ, so piece math reads like the Blender script.
// ---------------------------------------------------------------------------
const W = 10, H = 10, TILE = 2, TOP = 0.22;
// These change with a random game's rule twists (see RULES below); resetRules() puts them back.
let BALL_R = 0.15, G = 9.8;
const TYPES = ["floor", "wall", "ramp", "booster", "bouncer", "goal", "start", "spinner", "target", "net", "pins"];
const LABEL = { floor: "Floor", wall: "Wall", ramp: "Ramp", booster: "Boost", bouncer: "Bumper", goal: "Hole", start: "Tee", spinner: "Spinner", target: "Target", net: "Goal net", pins: "Pin deck" };
const SWATCH = { floor: "#5ccf4f", wall: "#ff8a3d", ramp: "#7ee06f", booster: "#2fa8ff", bouncer: "#ff4fa0", goal: "#1b1b1b", start: "#ffd23f", spinner: "#8a5cff", target: "#ff3b3b", net: "#ffffff", pins: "#e8c07a" };
const PLAYER_COLORS = ["#ffffff", "#ffd23f", "#ff4fa0", "#2fa8ff"];
const PLAYER_NAMES = ["White", "Yellow", "Pink", "Blue"];
let MAX_STROKES = 10; const SPIN_W = 1.6, MAX_SHOT = 12, PIECE_BUDGET = 120;

// ---------------------------------------------------------------------------
// Rule twists. A random game = a game + a random arena + 1–2 twists from this list.
// Each twist says which games it works in and what it changes. Names stack into a title.
// ---------------------------------------------------------------------------
let FRICTION = 1, BOUNCE = 1, WIND = [0, 0], SHOT_MULT = 1, TARGET_SPEED = 1, TARGET_SIZE = 1, ROBOT_SPEED = 1, ROBOT_COUNT = 1, LIVES = 3;
let activeTwists = [];
const TWISTS = [
  { id: "moon", word: "Moon", name: "Moon gravity", desc: "Everything floats and flies further.", color: "#8a5cff", games: ["golf", "blast", "rush", "splat", "race", "pitch", "bowl", "koth"], apply: () => { G = 9.8 * 0.38; } },
  { id: "ice", word: "Ice", name: "Ice rink", desc: "The ball barely slows down.", color: "#2fa8ff", games: ["golf", "bowl"], apply: () => { FRICTION = 0.3; } },
  { id: "bouncy", word: "Bouncy", name: "Super bouncy", desc: "Walls and bumpers bounce way harder.", color: "#ff4fa0", games: ["golf", "blast", "rush", "splat", "race", "pitch", "bowl", "koth"], apply: () => { BOUNCE = 1.35; } },
  { id: "giant", word: "Giant", name: "Giant ball", desc: "Your ball is twice as big.", color: "#ff8a3d", games: ["golf", "bowl"], apply: () => { BALL_R = 0.3; } },
  { id: "tiny", word: "Tiny", name: "Tiny ball", desc: "A pea-sized ball. The cup feels huge.", color: "#3fbf55", games: ["golf"], apply: () => { BALL_R = 0.08; } },
  { id: "windy", word: "Windy", name: "Windy", desc: "A steady wind pushes every shot.", color: "#6b7f92", games: ["golf", "blast", "rush", "splat"],
    apply: () => { const a = Math.random() * Math.PI * 2; WIND = [Math.cos(a) * 1.6, Math.sin(a) * 1.6]; } },
  { id: "rocket", word: "Rocket", name: "Rocket putts", desc: "Shots go 60% faster.", color: "#ff3b3b", games: ["golf"], apply: () => { SHOT_MULT = 1.6; } },
  { id: "short", word: "Sudden-Death", name: "Sudden death", desc: { golf: "Only 4 strokes, then you're out.", blast: "Just 15 seconds each.", rush: "Only 1 life for the whole team.", splat: "Just 30 seconds each.", race: "Finish in 45 seconds or you're out.", pitch: "Next goal wins.", bowl: "Only 3 frames.", koth: "Only 25 seconds on the hill.", fish: "Just 1 minute to fish." }, color: "#1d2b3a", games: ["golf", "blast", "rush", "splat", "race", "pitch", "bowl", "koth", "fish"],
    apply: () => { MAX_STROKES = 4; BLAST_TIME = 15; LIVES = 1; SPLAT_TIME = 30; RACE_LIMIT = 45; GOALS_TO_WIN = 1; BOWL_FRAMES = 3; KOTH_TIME = 25; FISH_TIME = 60; } },
  { id: "speedy", word: "Speedy", name: "Speedy targets", desc: "Targets pop up and drop twice as fast.", color: "#ffd23f", games: ["blast"], apply: () => { TARGET_SPEED = 1.9; } },
  { id: "big", word: "Big-Target", name: "Big targets", desc: "Targets are easier to hit.", color: "#5ccf4f", games: ["blast"], apply: () => { TARGET_SIZE = 1.5; } },
  { id: "rapid", word: "Rapid-Fire", name: "Rapid fire", desc: "The blaster fires three times as fast.", color: "#ff8a3d", games: ["blast", "rush", "splat"], apply: () => { FIRE_COOLDOWN = 0.07; } },
  { id: "turbo", word: "Turbo", name: "Turbo robots", desc: "Robots move 60% faster.", color: "#ff3b3b", games: ["rush"], apply: () => { ROBOT_SPEED = 1.6; } },
  { id: "swarm", word: "Swarm", name: "Robot swarm", desc: "Way more robots per wave.", color: "#8a5cff", games: ["rush"], apply: () => { ROBOT_COUNT = 1.7; } },
  { id: "legs", word: "Turbo-Legs", name: "Turbo legs", desc: "Everyone runs 50% faster.", color: "#ff3b3b", games: ["splat", "race", "pitch", "koth"], apply: () => { AVATAR_SPEED = 1.5; } },
  { id: "slip", word: "Slippery", name: "Slippery floor", desc: "It's hard to stop and turn.", color: "#2fa8ff", games: ["splat", "race", "pitch", "koth"], apply: () => { FRICTION_AV = 0.25; } },
  { id: "army", word: "Bot-Army", name: "Bot army", desc: "Six robots instead of three.", color: "#46566a", games: ["splat"], apply: () => { BOT_COUNT = 6; } },
  { id: "mega", word: "Mega-Ball", name: "Mega ball", desc: "A giant ball, easier to hit, harder to stop.", color: "#ffd23f", games: ["pitch"], apply: () => { PITCH_BALL_R = 0.8; } },
  { id: "hungry", word: "Hungry-Fish", name: "Hungry fish", desc: "Fish bite every 4–12 seconds.", color: "#3fbf55", games: ["fish"], apply: () => { FISH_BITE = [4, 12]; } },
  { id: "monster", word: "Monster", name: "Monster fish", desc: "Tuna and sharks show up way more.", color: "#1d3557", games: ["fish"], apply: () => { FISH_BIG = 3; } },
  { id: "hop", word: "Super-Jump", name: "Super jump", desc: "Jumps go way higher and further.", color: "#3fbf55", games: ["race"], apply: () => { JUMP_MULT = 1.5; } },
];
function resetRules() {
  BALL_R = 0.15; G = 9.8; FRICTION = 1; BOUNCE = 1; WIND = [0, 0]; SHOT_MULT = 1; MAX_STROKES = 10;
  BLAST_TIME = 30; FIRE_COOLDOWN = 0.22; TARGET_SPEED = 1; TARGET_SIZE = 1; ROBOT_SPEED = 1; ROBOT_COUNT = 1; LIVES = 3;
  AVATAR_SPEED = 1; FRICTION_AV = 1; BOT_COUNT = 3; SPLAT_TIME = 60; RACE_LIMIT = 90; GOALS_TO_WIN = 3; PITCH_BALL_R = 0.45; JUMP_MULT = 1;
  BOWL_FRAMES = 5; KOTH_TIME = 45; FISH_BITE = [10, 45]; FISH_BIG = 1; FISH_TIME = fishMinutes * 60;

const templates = {};
function b64ToBuf(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function loadTemplates() {

    const fallback = () => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(TILE, 0.24, TILE), new THREE.MeshLambertMaterial({ color: SWATCH[t] }));
      m.position.y = 0.12; const g = new THREE.Group(); g.add(m); templates[t] = g; res();

function makeNetTemplate() {

// Share code: 5 bytes per piece -> base64. Same idea as the 6-byte network form in docs/pieces.md.
function encode() {
  const bytes = [];
  for (const p of grid.values()) bytes.push(TYPES.indexOf(p.type), p.x, p.y, p.lvl, p.rot);

function decode(code) {

  if (bin.length % 5) throw new Error("This code is cut off. Copy the whole thing.");
  for (let i = 0; i < bin.length; i += 5) {
    const [t, x, y, l, r] = [0, 1, 2, 3, 4].map(k => bin.charCodeAt(i + k));
    if (!TYPES[t] || x >= W || y >= H || l > 2 || r > 3) throw new Error("This code has a piece outside the arena.");
    out.push([TYPES[t], x, y, l, r]);
  }

}

// ---------------------------------------------------------------------------
// Ground + colliders (analytic, per tile; the ball is a sphere rolling on a height field)
// ---------------------------------------------------------------------------
function surfaceAt(px, py) {

  if (x < 0 || y < 0 || x >= W || y >= H) return null;
  const p = grid.get(key(x, y));
  if (!p) return null;
  if (p.type === "ramp") {
    const [, ly] = toLocal(p, px, py);
    return p.lvl + 0.2 + (Math.max(-1, Math.min(1, ly)) + 1) / 2;

const KERB_H = 0.14, kerbs = new Map(), kerbGroup = new THREE.Group();

  for (const p of grid.values()) {
    if (p.type === "ramp") continue;
    const list = [], [cx, cy] = cellCenter(p.x, p.y), h = p.lvl + TOP;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const q = surfaceAt(cx + dx * (TILE / 2 + 0.05), cy + dy * (TILE / 2 + 0.05));
      if (q !== null && Math.abs(q - h) < 0.12) continue; // level neighbour: open edge
      if (q !== null && q > h + 0.28) continue;           // taller neighbour already blocks
      const along = dx === 0;
      list.push({ kind: "box", p: { x: p.x, y: p.y, rot: 0 }, lx: dx * 0.95, ly: dy * 0.95, hx: along ? 1.0 : 0.05, hy: along ? 0.05 : 1.0,
        ang: 0, lo: p.lvl, hi: h + KERB_H + 0.05, e: 0.7, kerb: true });
      const m = new THREE.Mesh(kerbGeo, kerbMat);
      m.position.set(cx + dx * 0.95, h + KERB_H / 2, -(cy + dy * 0.95));
      m.rotation.y = along ? 0 : Math.PI / 2;

function collidersNear(px, py) {
  const [cx, cy] = toCell(px, py), out = [];

    const kl = kerbs.get(key(cx + dx, cy + dy));

    const p = grid.get(key(cx + dx, cy + dy));
    if (!p) continue;
    const base = p.lvl;
    if (p.type === "wall") out.push({ kind: "box", p, lx: 0, ly: 0.85, hx: 1.0, hy: 0.15, ang: 0, lo: base, hi: base + 1.3, e: 0.75 });
    if (p.type === "ramp") for (const s of [-1, 1]) out.push({ kind: "box", p, lx: s * 0.93, ly: 0, hx: 0.07, hy: 1.0, ang: 0, lo: base, hi: base + 1.4, e: 0.6 });

    if (p.type === "spinner") {

    }

        out.push({ kind: "box", p, lx: s * 0.95, ly: 0.62, hx: 0.04, hy: 0.33, ang: 0, lo: base, hi: base + 1.2, e: 0.2 }); // side nets
      }
      out.push({ kind: "box", p, lx: 0, ly: 0.95, hx: 0.95, hy: 0.04, ang: 0, lo: base, hi: base + 1.2, e: 0.15 });    // back net

// Resolve ball vs one collider in the piece's local frame. Returns true on contact.
function collide(b, c) {
  const R = b.r || BALL_R; // characters and the Pitch Ball ball carry their own radius

    const ca = Math.cos(-c.ang), sa = Math.sin(-c.ang);
    const rx = lx - c.lx, ry = ly - c.ly;

      const cxp = lx - c.lx, cyp = ly - c.ly;

// ---------------------------------------------------------------------------
// Balls / physics step
// ---------------------------------------------------------------------------
function makeBall(i) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 16),
    new THREE.MeshStandardMaterial({ color: PLAYER_COLORS[i], roughness: 0.35 }));
  m.castShadow = true;

function step(b, dt) {

    b.vx *= ns / speed; b.vy *= ns / speed; speed = ns;

  if (!b.grounded || speed > 0.3) { b.vx += WIND[0] * 0.5 * dt; b.vy += WIND[1] * 0.5 * dt; }
  if (speed > 16) { b.vx *= 16 / speed; b.vy *= 16 / speed; }

  b.x += b.vx * dt; b.y += b.vy * dt;

  // Height field: step up into a taller tile = wall bounce; step down or off the edge = airborne.
  let s = surfaceAt(b.x, b.y);

    if (s === null || s < b.z - 0.06) { b.grounded = false; b.vz = (b.z - prevZ) / dt > 0 ? (b.z - prevZ) / dt : 0; }

  }

  const here = grid.get(key(...toCell(b.x, b.y)));

}

// ---------------------------------------------------------------------------

    const cells = [{ x, y, d }], used = new Set([key(x, y)]);

      for (const nd of [turn, d, (d + 1) % 4, (d + 3) % 4]) {
        const nx = x + DIRS[nd][0], ny = y + DIRS[nd][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H || used.has(key(nx, ny))) continue;
        // Never touch an earlier part of the path, so every hole is a clean single lane.
        if (DIRS.some(([ax, ay]) => used.has(key(nx + ax, ny + ay)) && !(nx + ax === x && ny + ay === y))) continue;
        straight = nd === d ? straight + 1 : 0;
        d = nd; x = nx; y = ny; cells.push({ x, y, d }); used.add(key(x, y)); moved = true; break;
      }
      if (!moved) break;
    }
    if (cells.length >= 9) { cells[0].d = cells[1].d; return { cells, used }; }
  }
  return null;
}

function randomLayout() {
  const path = randomPath();
  if (!path) return { list: SAMPLE, order: null };
  const { cells, used } = path, n = cells.length, out = [];
  const order = new Map(cells.map((c, i) => [key(c.x, c.y), i])); // how far along the path each cell is
  // Maybe one ramp up a level, on a straight stretch (enter and leave in the same direction).
  let rampAt = -1;
  if (Math.random() < 0.65) {
    const spots = [];
    for (let i = 2; i < n - 2; i++) if (cells[i].d === cells[i + 1].d) spots.push(i);
    if (spots.length) rampAt = spots[rint(0, spots.length - 1)];
  }
  let spinners = 0;
  for (let i = 0; i < n; i++) {
    const c = cells[i], lvl = rampAt >= 0 && i > rampAt ? 1 : 0;
    if (i === 0) { out.push(["start", c.x, c.y, lvl, 0]); continue; }
    if (i === n - 1) { out.push(["goal", c.x, c.y, lvl, 0]); continue; }
    if (i === rampAt) { out.push(["ramp", c.x, c.y, 0, cells[i + 1].d]); continue; }
    const din = c.d, dout = cells[i + 1].d;
    if (din !== dout) { // corner
      const outside = [c.x + DIRS[din][0], c.y + DIRS[din][1]];
      const free = outside[0] >= 0 && outside[1] >= 0 && outside[0] < W && outside[1] < H && !used.has(key(...outside))
        && !DIRS.some(([ax, ay]) => used.has(key(outside[0] + ax, outside[1] + ay)) && !(outside[0] + ax === c.x && outside[1] + ay === c.y));
      if (free && Math.random() < 0.3) { // a bumper just past the corner to bank off
        out.push(["floor", c.x, c.y, lvl, 0], ["bouncer", outside[0], outside[1], lvl, 0]);
        used.add(key(...outside));
        order.set(key(...outside), i);
      } else out.push([Math.random() < 0.75 ? "wall" : "floor", c.x, c.y, lvl, din]); // wall on the far edge
      continue;
    }
    const r = Math.random();
    if (r < 0.2 && cells[i + 1] && i + 1 !== rampAt) out.push(["booster", c.x, c.y, lvl, dout]);
    else if (r < 0.32 && spinners < 2 && i !== rampAt - 1) { out.push(["spinner", c.x, c.y, lvl, 0]); spinners++; }
    else out.push(["floor", c.x, c.y, lvl, 0]);
  }
  return { list: out, order, cells };
}

// One simulated shot on a copy of a ball, at a fixed step (independent of frame rate).
function simShot(b0, dx, dy, power) {
  const b = { ...b0, vx: dx * power, vy: dy * power, vz: 0 }, t0 = time;
  for (let t = 0; t < 8; t += 1 / 60) {
    for (let s = 0; s < 8; s++) { step(b, 1 / 480); time += 1 / 480; }
    if (b.sunk || b.out) break;
    if (b.grounded && Math.hypot(b.vx, b.vy) < 0.06 && !onForceTile(b)) break;
  }
  time = t0;
  return b;
}

// Greedy solver on the current grid: strokes to hole out, or null if it can't within maxStrokes.
// With a path (random holes) it scores progress along the path; otherwise straight-line distance.
function solveHole(maxStrokes, path) {
  const st = findStart(), goal = [...grid.values()].find(p => p.type === "goal");
  if (!st || !goal) return null;
  const [gx, gy] = cellCenter(goal.x, goal.y), [sx, sy] = cellCenter(st.x, st.y);
  let ball = { x: sx, y: sy, z: st.lvl + TOP, vx: 0, vy: 0, vz: 0, grounded: true, sunk: false, out: false };
  for (let stroke = 1; stroke <= maxStrokes; stroke++) {
    let best = null;
    for (let a = 0; a < 36; a++) for (let pw = 2; pw <= 12; pw += 1.7) {
      const r = simShot(ball, Math.cos(a * Math.PI / 18), Math.sin(a * Math.PI / 18), pw);
      if (r.out) continue;
      if (r.sunk) return stroke;
      let score;
      if (path) {
        const idx = path.order.get(key(...toCell(r.x, r.y))) ?? 0;
        const next = path.cells[Math.min(idx + 1, path.cells.length - 1)], [nx, ny] = cellCenter(next.x, next.y);
        score = -idx * 10 + Math.hypot(r.x - nx, r.y - ny);
      } else score = Math.hypot(r.x - gx, r.y - gy) + Math.abs(r.z - (goal.lvl + TOP)) * 4;
      if (!best || score < best.score) best = { score, r };
    }
    if (!best) return null;
    ball = { ...best.r, vx: 0, vy: 0, vz: 0 };
  }
  return null;
}

function makeRandomHole() {
  const deadline = performance.now() + 4000; // keep phones snappy: take the best hole found in time
  let best = null;
  for (let tries = 0; tries < 10 && performance.now() < deadline; tries++) {
    const layout = randomLayout();
    loadList(layout.list);
    rebuildKerbs(); // the solver needs the kerbs now, not next frame
    const strokes = solveHole(6, layout.order ? layout : null);
    if (!strokes) continue;
    if (!best || strokes > best.strokes) best = { layout, strokes };
    if (strokes >= 2) break; // skip holes the bot can ace on the first try
  }
  if (best) {
    loadList(best.layout.list); rebuildKerbs();
    par = best.strokes + 1; // the bot aims perfectly; people get one extra
    save(); return true;
  }
  loadList(SAMPLE); rebuildKerbs(); par = 3; save();
  return false;
}

function randomHoleThenPlay() {
  toast("Making a hole…");
  setTimeout(() => { // let the toast paint before the solver runs
    makeRandomHole();
    startPlay();
  }, 60);
}

// ---------------------------------------------------------------------------
// Game flow
// ---------------------------------------------------------------------------
function findStart() { for (const p of grid.values()) if (p.type === "start") return p; return null; }
// Which game the arena is played as. Each game needs a tee plus its own "goal" piece.
let game = "golf";
const GAMES = {
  golf: { name: "Mini-golf", needs: "goal", needLabel: "a hole" },
  blast: { name: "Target Blast", needs: "target", needLabel: "a target" },
  rush: { name: "Robot Rush", needs: "goal", needLabel: "a hole (robots come out of it) joined to the tee" },
  splat: { name: "Splat Tag", needs: "start", needLabel: "at least 6 tiles to run around on" },
  race: { name: "Obstacle Race", needs: "goal", needLabel: "a hole as the finish line" },
  pitch: { name: "Pitch Ball", needs: "net", needLabel: "two goal nets" },
  bowl: { name: "Bumper Bowling", needs: "pins", needLabel: "a pin deck" },
  koth: { name: "King of the Hill", needs: "hill", needLabel: "a hill (some tiles at height 1 or 2)" },
  fish: { name: "Beach Fishing", needs: "", needLabel: "" },
};
function validity(g = game) {
  let starts = 0, goals = 0, targets = 0, nets = 0;
  for (const p of grid.values()) { if (p.type === "start") starts++; if (p.type === "goal") goals++; if (p.type === "target") targets++; if (p.type === "net") nets++; }
  if (g === "pitch") return { starts, goals, targets, nets, need: nets >= 2 ? 1 : 0, ok: nets >= 2, noTee: true };
  if (g === "fish") return { starts, goals, targets, nets, need: 1, ok: true, noTee: true };
  if (g === "koth") { const hill = grid.size >= 6 && [...grid.values()].some(p => p.lvl >= 1); return { starts, goals, targets, nets, need: hill ? 1 : 0, ok: hill, noTee: true }; }
  if (g === "bowl") { const deck = [...grid.values()].some(p => p.type === "pins"); return { starts, goals, targets, nets, need: deck ? 1 : 0, ok: starts === 1 && deck }; }
  const need = g === "blast" ? targets : g === "rush" ? (goals && starts === 1 && robotPath() ? 1 : 0)
    : g === "splat" ? (grid.size >= 6 ? 1 : 0) : goals;
  return { starts, goals, targets, nets, need, ok: starts === 1 && need >= 1 };
}
function validityMessage(v, g = game) { return !v.noTee && v.starts !== 1 ? "Place exactly one tee" : `Place ${GAMES[g].needLabel}`; }

function startPlay() {
  if (game === "blast") return startBlast();
  if (game === "rush") return startRush();
  if (game === "splat") return startSplat();
  if (game === "race") return startRace();
  if (game === "pitch") return startPitch();
  if (game === "bowl") return startBowl();
  if (game === "koth") return startKoth();
  if (game === "fish") return startFish();
  const v = validity();
  if (!v.ok) { toast(validityMessage(v)); return; }
  const st = findStart(), [sx, sy] = cellCenter(st.x, st.y);
  for (const pl of players) scene.remove(pl.mesh);
  players = [];
  for (let i = 0; i < playerCount; i++) {
    const off = playerCount > 1 ? (i - (playerCount - 1) / 2) * 0.4 : 0;
    const b = { x: sx + off, y: sy, z: st.lvl + TOP, vx: 0, vy: 0, vz: 0, grounded: true, sunk: false, out: false };
    players.push({ i, ball: b, strokes: 0, last: [b.x, b.y, b.z], mesh: makeBall(i), done: false, waiting: false });
  }
  turn = 0; shotLive = false;
  setMode("play");
  toast(playerCount > 1 ? PLAYER_NAMES[0] + " tees off" : "Tee off!");
}

let shotLive = false;
function shoot(dx, dy, power) {
  const pl = players[turn];
  pl.last = [pl.ball.x, pl.ball.y, pl.ball.z];
  pl.ball.vx = dx * power; pl.ball.vy = dy * power;
  pl.strokes++;
  shotLive = true;
}

function afterShot() {
  shotLive = false;
  for (const pl of players) {
    const b = pl.ball;
    if (b.out) {
      b.out = false; [b.x, b.y, b.z] = pl.last; b.vx = b.vy = b.vz = 0; b.grounded = true;
      pl.strokes++; toast("Out of bounds +1");
    }
    if (b.sunk && !pl.done) { pl.done = true; toast(pl.strokes === 1 ? "Hole in one!" : `${PLAYER_NAMES[pl.i]} sinks it · ${pl.strokes}`); }
    if (!pl.done && pl.strokes >= MAX_STROKES) { pl.done = true; pl.picked = true; b.sunk = true; pl.mesh.visible = false; toast(`${PLAYER_NAMES[pl.i]} picks up`); }
  }
  if (players.every(p => p.done)) { setTimeout(showResults, 900); return; }
  // Next player who is still out on the course
  for (let k = 1; k <= players.length; k++) {
    const n = (turn + k) % players.length;
    if (!players[n].done) { turn = n; break; }
  }
  if (players.length > 1) setTimeout(() => toast(PLAYER_NAMES[turn] + "'s turn"), 700);
  renderHud();
}

// ---------------------------------------------------------------------------
// Target Blast: a foam-ball blaster on the tee. Targets pop up and drop on their own; tap one to
// fire at it. Each player gets a 30-second turn (pass the phone). Higher targets score more.
// Walls are cover, bumpers bounce shots, spinners swat them, so the arena you build matters.
// ---------------------------------------------------------------------------
let BLAST_TIME = 30, FIRE_COOLDOWN = 0.22; const SHOT_R = 0.13;
let blast = null; // { cur, timeLeft, running, shots: [], cooldown }
const shotGeo = new THREE.SphereGeometry(SHOT_R, 14, 10);
const particles = [], partGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);

// The blaster: a chunky barrel on the tee, tinted for whoever is shooting.
const blaster = new THREE.Group();
const blasterMat = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.4 });
const blasterBase = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.3, 20), new THREE.MeshStandardMaterial({ color: "#1d2b3a", roughness: 0.6 }));
blasterBase.position.y = 0.15;
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.75, 16), blasterMat);
barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.45, -0.25);
const barrelPivot = new THREE.Group(); barrelPivot.add(barrel);
blaster.add(blasterBase, barrelPivot);
blaster.traverse(o => { if (o.isMesh) o.castShadow = true; });
blaster.visible = false;
scene.add(blaster);

function targetPieces() { return [...grid.values()].filter(p => p.type === "target"); }
function boardCentre(p) { const [x, y] = cellCenter(p.x, p.y); return [x, y, p.lvl + 1.2]; }
function resetTargets(allUp) {
  for (const p of targetPieces()) p.t = { up: allUp, timer: allUp ? 0 : 0.3 + Math.random() * 1.5 };
}

function startBlast() {
  const v = validity("blast");
  if (!v.ok) { toast(validityMessage(v, "blast")); return; }
  for (const pl of players) scene.remove(pl.mesh);
  players = [];
  for (let i = 0; i < playerCount; i++) players.push({ i, score: 0, shots: 0, hits: 0, done: false, mesh: new THREE.Group() });
  turn = 0;
  blast = { kind: "blast", cur: 0, timeLeft: BLAST_TIME, running: false, shots: [], cooldown: 0 };
  const st = findStart(), [sx, sy] = cellCenter(st.x, st.y);
  blaster.position.set(sx, st.lvl + TOP, -sy);
  blaster.visible = true;
  resetTargets(false);
  setMode("play");
  readyBlastTurn();
}

function readyBlastTurn() {
  const pl = players[turn];
  blasterMat.color.set(PLAYER_COLORS[pl.i]);
  resetTargets(false);
  blast.timeLeft = BLAST_TIME; blast.running = false;
  sheet(`<h2>${players.length > 1 ? PLAYER_NAMES[pl.i] + "'s turn" : "Ready?"}</h2>
    <p>Targets pop up and drop again. Tap one to blast it. Higher targets score more. You have ${BLAST_TIME} seconds.</p>
    <button class="btn primary" id="goBlast">Go!</button>`, (h, close) => {
    h.querySelector("#goBlast").onclick = () => { close(); blast.running = true; renderHud(); };
  });
  renderHud();
}

function endBlastTurn() {
  blast.running = false;
  for (const s of blast.shots) scene.remove(s.mesh);
  blast.shots = [];
  players[turn].done = true;
  const next = players.findIndex(p => !p.done);
  if (next < 0) { setTimeout(showResults, 500); renderHud(); return; }
  turn = next;
  toast("Time!");
  setTimeout(readyBlastTurn, 900);
}

// Where a tap is aiming: a target board if one is under the finger, otherwise the ground.
const boardHitTargets = () => targetPieces().map(p => p.obj.userData.board).filter(Boolean);
function blastAimPoint(ev) {
  rayFromEvent(ev);
  if (rush) { // aim assist: lead a tapped robot by where it will be when the shot lands
    const rh = ray.intersectObjects(rush.robots.filter(r => !r.dead).map(r => r.mesh), true);
    if (rh.length) {
      let o = rh[0].object; while (o && !o.userData.robot) o = o.parent;
      if (o) return leadRobot(o.userData.robot);
    }
  }
  const hits = ray.intersectObjects(boardHitTargets(), true);
  if (hits.length) return [hits[0].point.x, -hits[0].point.z, hits[0].point.y];
  const c = cellUnder(ev);
  if (c) {
    const p = grid.get(key(c[0], c[1]));
    const h = p ? p.lvl + TOP : TOP, g = groundHit(ev, h);
    if (g) return [g[0], g[1], h];
  }
  const g = groundHit(ev, TOP);
  return g ? [g[0], g[1], TOP] : null;
}

function fireAt(target) {
  if (!blast || !blast.running || blast.cooldown > 0) return;
  const st = findStart(), [sx, sy] = cellCenter(st.x, st.y), sz = st.lvl + TOP + 0.5;
  const [tx, ty, tz] = target, dx = tx - sx, dy = ty - sy, dist = Math.hypot(dx, dy);
  if (dist < 0.6) return;
  // Flight time: always a lob, steep enough to drop over the cover walls in front of targets.
  const T = Math.max(0.5, Math.min(1.0, 0.35 + dist / 18));
  const s = { x: sx + dx / dist * 0.5, y: sy + dy / dist * 0.5, z: sz, vx: dx / T, vy: dy / T, vz: (tz - sz + 0.5 * G * T * T) / T,
    grounded: false, bounces: 0, life: 3, hit: false };
  s.mesh = netTrack(new THREE.Mesh(shotGeo, new THREE.MeshStandardMaterial({ color: PLAYER_COLORS[players[turn].i], roughness: 0.5 })), "shot", PLAYER_COLORS[players[turn].i]);
  s.mesh.castShadow = true;
  scene.add(s.mesh);
  blast.shots.push(s);
  blast.cooldown = blast.kind === "rush" ? FIRE_COOLDOWN * 1.8 : FIRE_COOLDOWN; // the robot blaster reloads slower
  players[turn].shots++;
  barrelPivot.rotation.y = Math.atan2(-dx, dy);
  barrel.position.z = -0.12; // recoil, springs back in the frame loop
}

function burst(x, y, z, color) {
  if (hostSync) Net.send({ t: "burst", a: [r2(x), r2(y), r2(z), color] }, false);
  for (let i = 0; i < 14; i++) {
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color: i % 2 ? color : "#ffffff", transparent: true }));
    m.position.set(x, z, -y);
    scene.add(m);
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 3;
    particles.push({ m, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: 2 + Math.random() * 3, life: 0.7 });
  }
}

function stepShot(s, h) {
  s.vz -= G * h; s.vx += WIND[0] * h; s.vy += WIND[1] * h;
  s.x += s.vx * h; s.y += s.vy * h; s.z += s.vz * h;
  // Target boards that are up
  if (!s.hit) for (const p of targetPieces()) {
    if (!p.t || !p.t.up) continue;
    const [bx, by, bz] = boardCentre(p);
    if (Math.hypot(s.x - bx, s.y - by) < (0.45 + SHOT_R * 0.5) * TARGET_SIZE && Math.abs(s.z - bz) < 0.45 * TARGET_SIZE) {
      p.t.up = false; p.t.timer = 0.6 + Math.random() * 1.4;
      const pts = 1 + p.lvl, pl = players[turn];
      pl.score += pts; pl.hits++;
      s.hit = true; s.vx *= -0.25; s.vy *= -0.25; s.vz = Math.abs(s.vz) * 0.3;
      burst(bx, by, bz, "#ff3b3b");
      if (pts > 1) toast(`+${pts}`);
      renderHud();
    }
  }
  // Robots (Robot Rush)
  if (!s.hit && rush) for (const r of rush.robots) {
    if (r.dead) continue;
    const sz = r.size || 1;
    if (Math.hypot(s.x - r.x, s.y - r.y) < 0.42 * sz && Math.abs(s.z - (r.z + 0.35 * sz)) < 0.45 * sz) {
      s.hit = true; s.vx *= -0.2; s.vy *= -0.2; s.vz = Math.abs(s.vz) * 0.3;
      players[turn].hits++;
      if (--r.hp > 0) { burst(r.x, r.y, r.z + 0.5, "#ffffff"); r.mesh.scale.setScalar(sz * 0.9); renderHud(); continue; } // tank dented
      r.dead = true;
      players[turn].score += r.type === "tank" ? 3 : r.type === "zippy" ? 2 : 1;
      burst(r.x, r.y, r.z + 0.35, r.color);
      renderHud();
    }
  }
  // Walls, bumpers, spinners, kerbs (they only matter at the heights they occupy)
  for (const c of collidersNear(s.x, s.y)) collide(s, c);
  // Ground
  const g = surfaceAt(s.x, s.y);
  if (g !== null && s.z <= g && s.vz < 0) {
    if (g > s.z + 0.35) { s.vx *= -0.4; s.vy *= -0.4; } // hit the side of a raised tile
    else { s.z = g; s.vz = -s.vz * 0.45; s.vx *= 0.7; s.vy *= 0.7; s.bounces++; }
  }
}

function updateBlast(dt) {
  if (!blast) return;
  barrel.position.z += (-0.25 - barrel.position.z) * Math.min(1, dt * 12);
  // Targets animate toward up (0) or flat (-1.5) and pop on their own timers while the clock runs.
  for (const p of targetPieces()) {
    if (!p.t) p.t = { up: true, timer: 0 };
    if (blast.running && blast.kind === "blast") {
      p.t.timer -= dt;
      if (p.t.timer <= 0) { p.t.up = !p.t.up; p.t.timer = (p.t.up ? 1.9 + Math.random() * 1.5 : 0.5 + Math.random() * 1.6) / TARGET_SPEED; }
    }
    const b = p.obj.userData.board;
    if (b) {
      b.rotation.x += ((b.userData.baseX || 0) + (p.t.up ? 0 : -1.5) - b.rotation.x) * Math.min(1, dt * 14);
      b.scale.setScalar(TARGET_SIZE);
    }
  }
  blast.cooldown = Math.max(0, blast.cooldown - dt);
  const SUB = 6, h = dt / SUB;
  for (const s of blast.shots) {
    for (let k = 0; k < SUB; k++) stepShot(s, h);
    s.life -= dt;
    s.mesh.position.set(s.x, s.z + SHOT_R, -s.y);
  }
  for (const s of blast.shots) if (s.life <= 0 || s.bounces > 2 || s.z < -4) scene.remove(s.mesh);
  blast.shots = blast.shots.filter(s => !(s.life <= 0 || s.bounces > 2 || s.z < -4));
  if (blast.running && blast.kind === "blast") {
    const before = Math.ceil(blast.timeLeft);
    blast.timeLeft -= dt;
    if (Math.ceil(blast.timeLeft) !== before) renderHud();
    if (blast.timeLeft <= 0) endBlastTurn();
  }
}

function updateParticles(dt) {
  for (const q of particles) {
    q.vz -= G * dt; q.life -= dt;
    q.m.position.x += q.vx * dt; q.m.position.z -= q.vy * dt; q.m.position.y += q.vz * dt;
    q.m.rotation.x += dt * 8; q.m.material.opacity = Math.max(0, q.life / 0.7);
    if (q.life <= 0) scene.remove(q.m);
  }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
}

// Random Target Blast arena: targets scattered at different distances and heights, some behind cover.
function randomBlastLayout() {
  const out = [], used = new Set();
  const tx = rint(3, W - 4), ty = rint(0, 1);
  out.push(["start", tx, ty, 0, 0]); used.add(key(tx, ty));
  const n = rint(6, 8), targets = [];
  for (let tries = 0; targets.length < n && tries < 400; tries++) {
    const x = rint(0, W - 1), y = rint(3, H - 1);
    if (used.has(key(x, y)) || targets.some(t => Math.abs(t[0] - x) + Math.abs(t[1] - y) < 3)) continue;
    const lvl = Math.random() < 0.45 ? rint(1, 2) : 0;
    targets.push([x, y, lvl]);
    out.push(["target", x, y, lvl, 2]); used.add(key(x, y)); // rot 2 faces the tee side
  }
  for (const [x, y, lvl] of targets) {
    // Half the targets get cover: a wall on the tile in front of them, toward the tee.
    if (Math.random() < 0.5) {
      const dy = -1, cx = x, cy = y + dy;
      if (cy > 1 && !used.has(key(cx, cy))) { out.push(["wall", cx, cy, lvl, 0]); used.add(key(cx, cy)); }
    }
  }
  for (let k = 0, extras = rint(2, 4); k < extras; k++) {
    for (let tries = 0; tries < 50; tries++) {
      const x = rint(0, W - 1), y = rint(2, H - 2);
      if (used.has(key(x, y))) continue;
      out.push([Math.random() < 0.5 ? "spinner" : "bouncer", x, y, 0, 0]); used.add(key(x, y)); break;

}

function randomBlastThenPlay() {
  loadList(randomBlastLayout()); rebuildKerbs(); par = null; save();
  startBlast();
}

// ---------------------------------------------------------------------------
// Robot Rush (co-op shooter): robots roll out of the hole and follow the course toward your tee.
// Blast them before they get there. 5 waves, shared lives; each wave a different player defends.
// Any mini-golf hole is a Robot Rush map, so the courses people build double as robot paths.
// ---------------------------------------------------------------------------
const RUSH_WAVES = 6;
let rush = null; // { wave, lives, robots, toSpawn, spawnTimer, path, total, waveRunning }
const ROBOT_COLORS = ["#ff8a3d", "#2fa8ff", "#ff4fa0", "#8a5cff", "#ff3b3b"];

// Can a robot roll from cell a to its neighbour b? Same rule as kerbs: the edge must be level,
// and wall pieces block the edge their wall sits on.
function edgeOpen(a, b) {
  const [ax, ay] = cellCenter(a.x, a.y), dx = b.x - a.x, dy = b.y - a.y;
  const ex = ax + dx * TILE / 2, ey = ay + dy * TILE / 2;
  const ha = surfaceAt(ex - dx * 0.05, ey - dy * 0.05), hb = surfaceAt(ex + dx * 0.05, ey + dy * 0.05);
  if (ha === null || hb === null || Math.abs(ha - hb) > 0.12) return false;
  const pa = grid.get(key(a.x, a.y)), pb = grid.get(key(b.x, b.y));
  const dirIndex = (ddx, ddy) => DIRS.findIndex(([x, y]) => x === ddx && y === ddy);
  if (pa.type === "wall" && pa.rot === dirIndex(dx, dy)) return false;
  if (pb.type === "wall" && pb.rot === dirIndex(-dx, -dy)) return false;
  return true;
}
// Shortest tile path from the hole to the tee (breadth-first search), as plane points.
function robotPath() {
  const goal = [...grid.values()].find(p => p.type === "goal"), st = findStart();
  if (!goal || !st) return null;
  const prev = new Map([[key(goal.x, goal.y), null]]), queue = [goal];
  while (queue.length) {
    const c = queue.shift();
    if (c === st) break;
    for (const [dx, dy] of DIRS) {
      const n = grid.get(key(c.x + dx, c.y + dy));
      if (!n || prev.has(key(n.x, n.y)) || !edgeOpen(c, n)) continue;
      prev.set(key(n.x, n.y), c); queue.push(n);
    }
  }
  if (!prev.has(key(st.x, st.y))) return null;
  const cells = [];
  for (let c = st; c; c = prev.get(key(c.x, c.y))) cells.push(c);
  cells.reverse(); // hole -> tee
  return cells.map(c => cellCenter(c.x, c.y));
}
function pointAlong(path, s) { // position at distance s along the path
  for (let i = 0; i < path.length - 1; i++) {
    const [ax, ay] = path[i], [bx, by] = path[i + 1], L = Math.hypot(bx - ax, by - ay);
    if (s <= L) return [ax + (bx - ax) * s / L, ay + (by - ay) * s / L, Math.atan2(-(bx - ax), by - ay)]; // yaw that faces local -Z along travel
    s -= L;
  }
  const e = path[path.length - 1]; return [e[0], e[1], 0];
}

const robotBodyGeo = new THREE.BoxGeometry(0.5, 0.42, 0.5), eyeGeo = new THREE.SphereGeometry(0.11, 14, 10);
const pupilGeo = new THREE.SphereGeometry(0.05, 10, 8), wheelGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.56, 14);
const antGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.22, 6), knobGeo = new THREE.SphereGeometry(0.06, 10, 8);
const whiteMat = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.4 }), darkMat = new THREE.MeshStandardMaterial({ color: "#1d2b3a", roughness: 0.6 });
function makeRobot(color) {
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color, roughness: 0.45 });
  const body = new THREE.Mesh(robotBodyGeo, mat); body.position.y = 0.36;
  const eye = new THREE.Mesh(eyeGeo, whiteMat); eye.position.set(0, 0.42, -0.24);
  const pupil = new THREE.Mesh(pupilGeo, darkMat); pupil.position.set(0, 0.42, -0.33);
  const wheels = new THREE.Mesh(wheelGeo, darkMat); wheels.rotation.z = Math.PI / 2; wheels.position.y = 0.12;
  const ant = new THREE.Mesh(antGeo, darkMat); ant.position.y = 0.68;
  const knob = new THREE.Mesh(knobGeo, mat); knob.position.y = 0.8;
  g.add(body, eye, pupil, wheels, ant, knob);
  netTrack(g, "robot", color);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });

function startRush() {
  const v = validity("rush");
  if (!v.ok) { toast(v.starts !== 1 ? "Place exactly one tee" : "Robots need a hole with a path to the tee"); return; }
  for (const pl of players) scene.remove(pl.mesh);
  players = [];
  for (let i = 0; i < playerCount; i++) players.push({ i, score: 0, shots: 0, hits: 0, done: false, mesh: new THREE.Group() });
  clearRobots();
  const path = robotPath();
  let total = 0; for (let i = 0; i < path.length - 1; i++) total += Math.hypot(path[i + 1][0] - path[i][0], path[i + 1][1] - path[i][1]);
  rush = { wave: 0, lives: LIVES, robots: [], toSpawn: 0, spawnTimer: 0, path, total, waveRunning: false };
  blast = { kind: "rush", running: false, shots: [], cooldown: 0, timeLeft: 0 };
  const st = findStart(), [sx, sy] = cellCenter(st.x, st.y);
  blaster.position.set(sx, st.lvl + TOP, -sy);
  setMode("play");
  readyRushWave();
}

function clearRobots() { if (rush) for (const r of rush.robots) scene.remove(r.mesh); }

function readyRushWave() {
  rush.wave++;
  turn = (rush.wave - 1) % players.length;
  const pl = players[turn];
  blasterMat.color.set(PLAYER_COLORS[pl.i]);
  blast.running = false;
  const count = Math.round((5 + rush.wave * 3.5) * ROBOT_COUNT);
  sheet(`<h2>Wave ${rush.wave} of ${RUSH_WAVES}</h2>
    <p>${players.length > 1 ? `<b>${PLAYER_NAMES[pl.i]}</b> defends. ` : ""}${count} robots are coming out of the hole. Tap them before they reach your blaster.${rush.wave === 2 ? " New: yellow Zippies are fast." : rush.wave === 3 ? " New: big grey Tanks take 3 hits." : ""} Lives left: ${rush.lives}.</p>
    <button class="btn primary" id="goWave">Go!</button>`, (h, close) => {
    h.querySelector("#goWave").onclick = () => {
      close();
      rush.toSpawn = count; rush.spawnTimer = 0.4; rush.waveRunning = true; blast.running = true; renderHud();
    };
  });
  renderHud();
}

function robotSpeed() { return (1.45 + 0.2 * rush.wave) * ROBOT_SPEED; }
function leadRobot(r) {
  const st = findStart(), [sx, sy] = cellCenter(st.x, st.y);
  let s = r.s, p = pointAlong(rush.path, s);
  for (let k = 0; k < 2; k++) { // flight time depends on distance, so refine twice
    const dist = Math.hypot(p[0] - sx, p[1] - sy), T = Math.max(0.5, Math.min(1.0, 0.35 + dist / 18));
    s = Math.min(rush.total, r.s + robotSpeed() * (r.speedMul || 1) * T); p = pointAlong(rush.path, s);
  }
  const z = surfaceAt(p[0], p[1]) ?? TOP;
  return [p[0], p[1], z + 0.35];
}

function updateRush(dt) {
  if (!rush) return;
  if (rush.waveRunning) {
    if (rush.toSpawn > 0 && (rush.spawnTimer -= dt) <= 0) {
      // Robot types: regular; "zippy" (small, fast) from wave 2; "tank" (big, slow, 3 hits) from wave 3.
      const roll = Math.random();
      const type = rush.wave >= 3 && roll < 0.18 ? "tank" : rush.wave >= 2 && roll < 0.45 ? "zippy" : "basic";
      const color = type === "tank" ? "#46566a" : type === "zippy" ? "#ffd23f" : ROBOT_COLORS[(rush.wave - 1) % ROBOT_COLORS.length];
      const mesh = makeRobot(color);
      mesh.scale.setScalar(type === "tank" ? 1.45 : type === "zippy" ? 0.75 : 1);
      const r = { s: 0, x: 0, y: 0, z: 0, color, mesh, dead: false, deadT: 0, bob: Math.random() * 6, type,
        hp: type === "tank" ? 3 : 1, speedMul: type === "tank" ? 0.65 : type === "zippy" ? 1.75 : 1, size: type === "tank" ? 1.45 : type === "zippy" ? 0.75 : 1 };
      mesh.userData.robot = r;
      scene.add(mesh); rush.robots.push(r);
      rush.toSpawn--; rush.spawnTimer = Math.max(0.3, 0.85 - rush.wave * 0.09) / ROBOT_COUNT;
    }
  }
  const sp = robotSpeed();
  for (const r of rush.robots) {
    if (r.dead) { // pop: shrink away
      r.deadT += dt; r.mesh.scale.setScalar(Math.max(0.01, (r.size || 1) * (1 - r.deadT * 5))); continue;
    }
    if (rush.waveRunning) r.s += sp * r.speedMul * dt;
    const [x, y, heading] = pointAlong(rush.path, r.s);
    r.x = x; r.y = y; r.z = surfaceAt(x, y) ?? r.z;
    r.bob += dt * 10;
    r.mesh.position.set(x, r.z + Math.abs(Math.sin(r.bob)) * 0.05, -y);
    r.mesh.rotation.y = heading;
    if (r.s >= rush.total) { // reached the tee
      r.dead = true; r.deadT = 1;
      rush.lives--;
      burst(x, y, r.z + 0.4, "#1d2b3a");
      toast(rush.lives > 0 ? "Ouch!" : "Overrun!");
      renderHud();
    }
  }
  for (const r of rush.robots) if (r.dead && r.deadT > 0.25) scene.remove(r.mesh);
  rush.robots = rush.robots.filter(r => !(r.dead && r.deadT > 0.25));

  if (rush.waveRunning && rush.lives <= 0) { endRush(false); return; }
  if (rush.waveRunning && rush.toSpawn === 0 && rush.robots.length === 0) {
    rush.waveRunning = false; blast.running = false;
    if (rush.wave >= RUSH_WAVES) endRush(true);
    else { toast(`Wave ${rush.wave} cleared!`); setTimeout(readyRushWave, 1000); }
  }
}

function endRush(won) {
  rush.waveRunning = false; blast.running = false; rush.won = won;
  for (const s of blast.shots) scene.remove(s.mesh);
  blast.shots = [];
  setTimeout(showResults, 700);
}

function randomRushThenPlay() {
  for (let i = 0; i < 20; i++) { // a random golf course is a robot path; make sure robots can follow it
    loadList(randomLayout().list); rebuildKerbs();
    if (robotPath()) break;
  }
  par = null; save();
  startRush();
}

// ===========================================================================
// Characters: the little toy figures you steer in Splat Tag, Obstacle Race and Pitch Ball.

const capsuleGeo = new THREE.CapsuleGeometry(0.24, 0.3, 6, 14), visorGeo = new THREE.BoxGeometry(0.36, 0.15, 0.12);

  const e1 = new THREE.Mesh(pupilSmall, darkMat); e1.position.set(-0.07, 0.63, -0.26);

  const f2 = f1.clone(); f2.position.x = 0.1;
  g.add(body, visor, e1, e2, f1, f2);

function newAvatar(color, x, y, z, opts = {}) {
  const a = { x, y, z, vx: 0, vy: 0, vz: 0, kx: 0, ky: 0, grounded: true, r: AV_R, wantX: 0, wantY: 0, jump: false,
    color, spawn: [x, y, z], safe: [x, y, z], walk: 0, ...opts };

}
function removeAvatar(a) { if (a && a.mesh) scene.remove(a.mesh); }

function stepAvatar(a, dt) {

  if (a.jump && a.grounded) { a.vz = JUMP_V * JUMP_MULT; a.grounded = false; }

    const pr = { x: a.x, y: a.y, z: a.z, vx: a.vx + a.kx, vy: a.vy + a.ky, r: a.r };
    if (collide(pr, c)) { a.x = pr.x; a.y = pr.y; a.kx += pr.vx - (a.vx + a.kx); a.ky += pr.vy - (a.vy + a.ky); }

  if (Math.hypot(a.vx, a.vy) > 0.4) a.mesh.rotation.y = Math.atan2(-a.vx, a.vy);

// ---- Joysticks: thumb anywhere in your zone, drag to steer. Screen up = away from the camera. ----
const sticks = new Map(); // pointerId -> { owner, ox, oy, x, y, el }
function stickEl() {
  const el = document.createElement("div");
  el.style.cssText = "position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.7);pointer-events:none;z-index:4";
  const knob = document.createElement("div");
  knob.style.cssText = "position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)";
  el.appendChild(knob); document.body.appendChild(el);
  return el;
}
function stickStart(ev, owner) {
  const st = { owner, ox: ev.clientX, oy: ev.clientY, x: ev.clientX, y: ev.clientY, el: stickEl() };
  st.el.style.left = st.ox + "px"; st.el.style.top = st.oy + "px";
  sticks.set(ev.pointerId, st);
}
function stickMove(ev) {
  const st = sticks.get(ev.pointerId); if (!st) return false;
  st.x = ev.clientX; st.y = ev.clientY;
  let dx = st.x - st.ox, dy = st.y - st.oy; const d = Math.hypot(dx, dy), max = 50;
  if (d > max) { dx *= max / d; dy *= max / d; }
  st.el.firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
  return true;
}
function stickEnd(ev) { const st = sticks.get(ev.pointerId); if (st) { st.el.remove(); sticks.delete(ev.pointerId); return true; } return false; }

// Joystick for an owner → a move direction on the ground (length 0..1), relative to the camera.
function stickDir(owner) {
  for (const st of sticks.values()) if (st.owner === owner) {
    let dx = st.x - st.ox, dy = st.y - st.oy; const d = Math.hypot(dx, dy);
    if (d < 8) return [0, 0];
    const m = Math.min(1, d / 50); dx /= d; dy /= d;
    const look = controls.target.clone().sub(camera.position); let fx = look.x, fy = -look.z; const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
    const rx = fy, ry = -fx; // screen right on the ground

// A foam shot from anywhere (players in Splat Tag, bots too). Same lob as the blaster.
function fireFrom(o, target, color, owner, list) {

  if (dist < 0.5) return null;

}

  s.x += s.vx * h; s.y += s.vy * h; s.z += s.vz * h;

}
const avatarHit = (s, a) => !a.hidden && Math.hypot(s.x - a.x, s.y - a.y) < 0.42 && s.z > a.z - 0.1 && s.z < a.z + 1.0;

function walkableCells() { return [...grid.values()].filter(p => p.type !== "spinner" && p.type !== "net"); }
function randomCellAway(px, py, minD) {
  const cells = walkableCells(); let best = null;
  for (let k = 0; k < 30; k++) {
    const p = cells[rint(0, cells.length - 1)], [x, y] = cellCenter(p.x, p.y);
    if (Math.hypot(x - px, y - py) >= minD) return [x, y, surfaceAt(x, y) ?? p.lvl + TOP];

// Camera that trails a character from behind and above (fixed angle, so the joystick always matches the screen).
function followCam(x, y, z, dt, far = 1) {
  const portrait = innerWidth < innerHeight;
  const tgt = new THREE.Vector3(x, z + 0.5, -y), off = new THREE.Vector3(0, (portrait ? 11 : 8.5) * far, (portrait ? 8.5 : 7) * far);
  const k = Math.min(1, dt * 4);
  controls.target.lerp(tgt, k);
  camera.position.lerp(tgt.clone().add(off), k);
  camera.lookAt(controls.target);
}

// ---------------------------------------------------------------------------
// SPLAT TAG: run around the arena and splat the robot bots before they splat you. 60-second turns.

  const st = findStart(), [sx, sy] = cellCenter(st.x, st.y);
  splat = { you: newAvatar(PLAYER_COLORS[0], sx, sy, st.lvl + TOP), bots: [], shots: [], timeLeft: SPLAT_TIME, running: false, cooldown: 0 };
  for (let k = 0; k < BOT_COUNT; k++) {
    const [x, y, z] = randomCellAway(sx, sy, 6);
    splat.bots.push(newAvatar(ROBOT_COLORS[k % ROBOT_COLORS.length], x, y, z, { robot: true, r: 0.32, think: 0, shootT: 1 + Math.random() * 2, goal: null }));

}
function readySplatTurn() {

  scene.remove(splat.you.mesh); splat.you = newAvatar(PLAYER_COLORS[pl.i], sx, sy, st.lvl + TOP);
  for (const b of splat.bots) { const [x, y, z] = randomCellAway(sx, sy, 6); Object.assign(b, { x, y, z, vx: 0, vy: 0, kx: 0, ky: 0, hidden: false, dead: 0 }); }
  splat.timeLeft = SPLAT_TIME; splat.running = false;
  sheet(`<h2>${players.length > 1 ? PLAYER_NAMES[pl.i] + "'s turn" : "Ready?"}</h2>
    <p>Left thumb: run. Tap anywhere else: throw a splat. Splat robots for points, but they throw back! ${SPLAT_TIME} seconds.</p>
    <button class="btn primary" id="goSplat">Go!</button>`, (h, close) => { h.querySelector("#goSplat").onclick = () => { close(); splat.running = true; renderHud(); }; });
  renderHud();

function splatShootAt(ev) {
  if (!splat || !splat.running || splat.cooldown > 0 || splat.you.stun > 0) return;
  const t = blastAimPoint(ev); if (!t) return;

  const near = splat.bots.filter(b => !b.hidden && Math.hypot(t[0] - b.x, t[1] - b.y) < 1.1)
    .sort((p, q) => Math.hypot(t[0] - p.x, t[1] - p.y) - Math.hypot(t[0] - q.x, t[1] - q.y))[0];

  if (fireFrom([y.x, y.y, y.z + 0.7], t, PLAYER_COLORS[players[turn].i], "you", splat.shots)) {
    splat.cooldown = FIRE_COOLDOWN + 0.05; players[turn].shots++;

function updateSplat(dt) {

  const [mx, my] = splat.running && you.stun <= 0 ? activeStick() : [0, 0];
  you.wantX = mx * AV_SPEED * AVATAR_SPEED; you.wantY = my * AV_SPEED * AVATAR_SPEED;
  stepAvatar(you, dt);
  for (const b of splat.bots) {
    if (b.hidden) { if ((b.dead -= dt) <= 0) { const [x, y, z] = randomCellAway(you.x, you.y, 6); Object.assign(b, { x, y, z, hidden: false, vx: 0, vy: 0 }); } continue; }

      b.think = 1.2 + Math.random() * 1.8;
      if (d > 7 || Math.random() < 0.35) { const c = randomCellAway(b.x, b.y, 2); b.goal = [c[0], c[1]]; }
      else { const a = Math.atan2(dy, dx) + (Math.random() < 0.5 ? 1.3 : -1.3); b.goal = [b.x + Math.cos(a) * 3, b.y + Math.sin(a) * 3]; }
    }

    b.wantX = gd > 0.3 ? gx / gd * sp : 0; b.wantY = gd > 0.3 ? gy / gd * sp : 0;
    stepAvatar(b, dt);

      b.shootT = 1.8 + Math.random() * 1.2;

    if (s.owner === "you") {

        burst(b.x, b.y, b.z + 0.4, b.color); renderHud(); return;
      }
    } else if (avatarHit(s, you) && you.stun <= 0 && !(you.safeT > 0)) {
      // 2 s of safety after a splat
      s.hit = true; you.stun = 0.6; you.safeT = 2; you.flash = 2; pl.splatted++; pl.score = Math.max(0, pl.score - 1);

      for (const s of splat.shots) scene.remove(s.mesh); splat.shots = [];

}

// Random playground for Splat Tag: a chunky blob of tiles with walls for cover, a raised deck and a few toys.
function randomPlaygroundLayout() {
  const out = [], used = new Map(), cx = rint(3, 6), cy = rint(3, 6);
  const add = (t, x, y, l, r) => { used.set(key(x, y), true); out.push([t, x, y, l, r]); };
  const cells = [[cx, cy]]; used.set(key(cx, cy), true);
  while (cells.length < rint(26, 34)) {
    const [bx, by] = cells[rint(0, cells.length - 1)], [dx, dy] = DIRS[rint(0, 3)], nx = bx + dx, ny = by + dy;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H || used.has(key(nx, ny))) continue;
    used.set(key(nx, ny), true); cells.push([nx, ny]);
  }
  used.clear();
  const [tx, ty] = cells[0];
  for (const [x, y] of cells) {
    if (x === tx && y === ty) { add("start", x, y, 0, 0); continue; }
    const r = Math.random();
    add(r < 0.13 ? "wall" : r < 0.18 ? "bouncer" : r < 0.22 ? "booster" : r < 0.25 ? "spinner" : "floor", x, y, 0, rint(0, 3));
  }
  return out;
}

  players = [];

function readyRaceTurn() {

  sheet(`<h2>${players.length > 1 ? PLAYER_NAMES[pl.i] + "'s run" : "Ready?"}</h2>
    <p>Left thumb: run. Tap the right side (or Jump): jump. Get to the flag as fast as you can. Fall off and you go back a step.</p>
    <button class="btn primary" id="goRace">Go!</button>`, (h, close) => { h.querySelector("#goRace").onclick = () => { close(); race.running = true; renderHud(); }; });
  renderHud();
}
function raceJump() { if (race && race.running) race.you.jump = true; }
function updateRace(dt) {
  if (!race || !race.you) return;
  const you = race.you, pl = players[turn];
  const [mx, my] = race.running ? activeStick() : [0, 0];
  you.wantX = mx * AV_SPEED * AVATAR_SPEED; you.wantY = my * AV_SPEED * AVATAR_SPEED;
  stepAvatar(you, dt);

  const before = Math.floor(race.t * 10); race.t += dt;
  if (Math.floor(race.t * 10) !== before) renderHud();
  const goal = [...grid.values()].find(p => p.type === "goal"), [gx, gy] = cellCenter(goal.x, goal.y);
  const finished = Math.hypot(you.x - gx, you.y - gy) < 0.8 && Math.abs(you.z - (goal.lvl + TOP)) < 0.7;

    if (finished) { burst(gx, gy, goal.lvl + 1.2, PLAYER_COLORS[pl.i]); burst(gx, gy, goal.lvl + 1.2, "#ffd23f"); }
    toast(finished ? fmtTime(race.t) : "Out of time");

const fmtTime = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;

// Random race: a winding course (the golf generator) with a couple of gaps to jump on the straights.
function randomRaceLayout() {
  const { list, cells } = randomLayout();
  if (!cells) return list;
  const isStraight = (i) => i > 0 && i < cells.length - 1 && cells[i].d === cells[i + 1].d;
  const typeAt = (c) => (list.find(p => p[1] === c.x && p[2] === c.y) || [])[0];
  const gaps = [];
  for (let i = 3; i < cells.length - 3 && gaps.length < 2; i++) {
    if (isStraight(i - 1) && isStraight(i) && typeAt(cells[i]) === "floor" && typeAt(cells[i + 1]) !== "goal"
      && typeAt(cells[i - 1]) !== "ramp" && typeAt(cells[i + 1]) !== "ramp" && Math.random() < 0.8
      && !gaps.some(g => Math.abs(g - i) < 3)) gaps.push(i);
  }
  const drop = new Set(gaps.map(i => key(cells[i].x, cells[i].y)));
  return list.filter(p => !drop.has(key(p[1], p[2])));
}

// ---------------------------------------------------------------------------
// PITCH BALL: knock the big ball into the other team's net. 1 player vs a bot, or 2 players head to head
// (each thumb-stick has its own half of the screen). 3–4 players add a bot teammate on each side.
// ---------------------------------------------------------------------------
let pitch = null;
const TEAM = [{ name: "Blue", color: "#2fa8ff" }, { name: "Pink", color: "#ff4fa0" }];
function netPieces() { return [...grid.values()].filter(p => p.type === "net"); }
function netSpawn(net, back) { // a point in front of a net, on a real tile
  const [fx, fy] = fwd(net.rot), [cx, cy] = cellCenter(net.x, net.y);
  for (const k of [back, 1.5, 1]) {
    const x = cx - fx * TILE * k, y = cy - fy * TILE * k, z = surfaceAt(x, y);
    if (z !== null) return [x, y, z];
  }
  return [cx, cy, net.lvl + TOP];
}
function makeBallMesh(r) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 128;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 256, 128); g.fillStyle = "#1d2b3a";
  for (let i = 0; i < 9; i++) { g.beginPath(); g.arc((i % 5) * 56 + (i > 4 ? 28 : 8), i > 4 ? 92 : 34, 13, 0, Math.PI * 2); g.fill(); }
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 18), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 }));
  m.castShadow = true; return netTrack(m, "pball", "#ffffff", r);
}
function startPitch() {
  const v = validity("pitch");
  if (!v.ok) { toast(validityMessage(v, "pitch")); return; }
  stopAvatarGames();
  for (const pl of players) scene.remove(pl.mesh);
  players = [];
  const nets = netPieces();
  pitch = { nets: [nets[0], nets[1]], score: [0, 0], members: [[], []], ball: null, timeLeft: 90, running: false, pause: 0, humans: Math.min(2, playerCount) };
  for (let t = 0; t < 2; t++) {
    const human = t === 0 || playerCount >= 2;
    pitch.members[t].push(newAvatar(TEAM[t].color, 0, 0, 0, { team: t, human, owner: human ? t : -1, role: "attack" }));
    if (playerCount >= 3) pitch.members[t].push(newAvatar(TEAM[t].color, 0, 0, 0, { team: t, human: false, owner: -1, role: "defend" }));
  }
  const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, grounded: true, sunk: false, out: false, r: PITCH_BALL_R };
  ball.mesh = makeBallMesh(PITCH_BALL_R); scene.add(ball.mesh);
  pitch.ball = ball;
  pitchKickoff();
  setMode("play");
  sheet(`<h2>Pitch Ball</h2>
    <p>${pitch.humans === 2 ? "Blue uses the left half of the screen, Pink uses the right half." : "Use your thumb anywhere to run."} Run into the ball to kick it. First to ${GOALS_TO_WIN} goal${GOALS_TO_WIN > 1 ? "s" : ""} wins.</p>
    <button class="btn primary" id="goPitch">Kick off!</button>`, (h, close) => { h.querySelector("#goPitch").onclick = () => { close(); pitch.running = true; renderHud(); }; });
}
function pitchKickoff() {
  const [a, b] = pitch.nets, [ax, ay] = cellCenter(a.x, a.y), [bx, by] = cellCenter(b.x, b.y);
  // Middle of the pitch: the walkable tile closest to halfway between the nets
  let mx = (ax + bx) / 2, my = (ay + by) / 2;
  if (surfaceAt(mx, my) === null) { const c = walkableCells().map(p => cellCenter(p.x, p.y)).sort((p, q) => Math.hypot(p[0] - mx, p[1] - my) - Math.hypot(q[0] - mx, q[1] - my))[0]; [mx, my] = c; }
  Object.assign(pitch.ball, { x: mx, y: my, z: (surfaceAt(mx, my) ?? TOP) + 0.3, vx: 0, vy: 0, vz: 0, grounded: false, out: false });
  for (let t = 0; t < 2; t++) pitch.members[t].forEach((m, k) => {
    const [x, y, z] = netSpawn(pitch.nets[t], k === 0 ? 2 : 1);
    Object.assign(m, { x, y, z, vx: 0, vy: 0, vz: 0, kx: 0, ky: 0, grounded: true, safe: [x, y, z] });

}
function pitchCamera() {
  // Fixed camera over the whole pitch so both players can see everything
  const [ax, ay] = cellCenter(pitch.nets[0].x, pitch.nets[0].y), [bx, by] = cellCenter(pitch.nets[1].x, pitch.nets[1].y);
  const mx = (ax + bx) / 2, my = (ay + by) / 2, span = Math.hypot(ax - bx, ay - by), portrait = innerWidth < innerHeight;
  controls.target.set(mx, 0.4, -my);
  camera.position.set(mx, span * (portrait ? 1.35 : 0.95) + 4, -my + span * (portrait ? 0.55 : 0.5) + 2);
  camera.lookAt(controls.target);
}
function updatePitch(dt) {
  if (!pitch) return;
  const ball = pitch.ball, all = pitch.members.flat();
  if (pitch.pause > 0) { pitch.pause -= dt; if (pitch.pause <= 0) pitchKickoff(); }
  for (const m of all) {
    let wx = 0, wy = 0;
    if (pitch.running && pitch.pause <= 0) {
      if (m.human) {
        if (Net.online) [wx, wy] = m.owner === 0 ? stickDir(0) : Net.remoteStick; // Play Together: player 2 steers from the other iPad
        else { const owner = pitch.humans === 2 ? m.owner : 0; [wx, wy] = stickDir(owner); }
      } else {
        // Bots: get behind the ball (facing the goal they attack), then charge it; defenders guard the net.
        const atk = pitch.nets[1 - m.team], own = pitch.nets[m.team], [ax, ay] = cellCenter(atk.x, atk.y), [ox, oy] = cellCenter(own.x, own.y);
        let tx, ty;
        if (m.role === "defend") { tx = ox + (ball.x - ox) * 0.35; ty = oy + (ball.y - oy) * 0.35; }
        else {
          const gx = ball.x - ax, gy = ball.y - ay, gl = Math.hypot(gx, gy) || 1;
          const bx = ball.x + gx / gl * 0.8, by = ball.y + gy / gl * 0.8;
          const behind = Math.hypot(m.x - bx, m.y - by) < 0.6 || (Math.hypot(m.x - ax, m.y - ay) > Math.hypot(ball.x - ax, ball.y - ay) + 0.3);
          [tx, ty] = behind ? [ball.x, ball.y] : [bx, by];
        }
        const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy);
        if (d > 0.2) { wx = dx / d * 0.7; wy = dy / d * 0.7; } // bots run a bit slower than you
      }
    }
    m.wantX = wx * AV_SPEED * AVATAR_SPEED; m.wantY = wy * AV_SPEED * AVATAR_SPEED;
    stepAvatar(m, dt);
  }
  pushApart(all);
  // Ball physics (same rolling physics as golf) and kicks
  for (let k = 0; k < 4; k++) step(ball, dt / 4);
  if (ball.out || ball.z < -3) { ball.out = false; pitchKickoff(); }
  for (const m of all) {
    const dx = ball.x - m.x, dy = ball.y - m.y, d = Math.hypot(dx, dy), min = m.r + ball.r;
    if (d === 0 || d >= min || Math.abs(ball.z - m.z) > 0.9) continue;
    const nx = dx / d, ny = dy / d;
    ball.x = m.x + nx * min; ball.y = m.y + ny * min;
    const vn = ball.vx * nx + ball.vy * ny, kick = Math.hypot(m.vx + m.kx, m.vy + m.ky) * 1.5 + 1.5;
    if (vn < kick) { ball.vx += nx * (kick - vn); ball.vy += ny * (kick - vn); if (kick > 6) { ball.vz = 1.6; ball.grounded = false; } }
  }

  if (pitch.pause <= 0 && pitch.running) for (let t = 0; t < 2; t++) {
    const net = pitch.nets[t], [lx, ly] = toLocal(net, ball.x, ball.y);
    const [cx, cy] = toCell(ball.x, ball.y);
    if (cx === net.x && cy === net.y && Math.abs(lx) < 0.9 && ly > 0.35 && ball.z < net.lvl + 1.2) {
      const scorer = 1 - t; pitch.score[scorer]++;
      burst(ball.x, ball.y, ball.z + 0.5, TEAM[scorer].color); burst(ball.x, ball.y, ball.z + 0.5, "#ffffff");
      const who = Net.online && pitch.humans === 2 ? PLAYER_NAMES[scorer] : TEAM[scorer].name;
      toast(`${who} scores!`);
      pitch.pause = 1.6; renderHud();
      if (pitch.score[scorer] >= GOALS_TO_WIN) { pitch.running = false; clearSticks(); setTimeout(showResults, 1400); }
      break;
    }
  }
  ball.mesh.position.set(ball.x, ball.z + ball.r, -ball.y);
  if (ball.grounded) { ball.mesh.rotation.x -= ball.vy * dt / ball.r; ball.mesh.rotation.z -= ball.vx * dt / ball.r; }
  for (const m of all) drawAvatar(m, dt);
  pitchCamera();
  if (pitch.running && pitch.pause <= 0) {
    const before = Math.ceil(pitch.timeLeft); pitch.timeLeft -= dt;
    if (Math.ceil(pitch.timeLeft) !== before) renderHud();
    if (pitch.timeLeft <= 0) { pitch.running = false; clearSticks(); setTimeout(showResults, 600); }
  }
}

// Random pitch: a walled rectangle with a net at each end and a couple of toys in the way.
function randomPitchLayout() {
  const out = [], x0 = 2, x1 = 6, y0 = 1, y1 = 8, mid = 4;
  out.push(["net", mid, 0, 0, 2], ["net", mid, 9, 0, 0]);
  const extras = new Map();
  for (let k = 0, n = rint(1, 3); k < n; k++) {
    const x = rint(x0, x1), y = rint(y0 + 2, y1 - 2);
    if (!(x === mid && (y === 4 || y === 5))) extras.set(key(x, y), Math.random() < 0.6 ? "bouncer" : "booster");
  }
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) out.push([extras.get(key(x, y)) || "floor", x, y, 0, rint(0, 3)]);
  return out;
}

function stopAvatarGames() {
  clearSticks();
  if (koth) { removeAvatar(koth.you); koth.bots.forEach(removeAvatar); koth = null; kerbsDirty = true; }
  if (splat) { removeAvatar(splat.you); splat.bots.forEach(removeAvatar); splat.shots.forEach(s => scene.remove(s.mesh)); splat = null; }
  if (race) { removeAvatar(race.you); race = null; }
  if (pitch) { pitch.members.flat().forEach(removeAvatar); scene.remove(pitch.ball.mesh); pitch = null; }
}

// Pointer handling for the character games (called from the canvas listeners first).
function avatarPointer(type, ev) {
  if (ev.remote) { // from the other iPad (its joystick is sent separately)
    if (type === "down") { if (game === "splat") splatShootAt(ev); else if (game === "race") raceJump(); else if (game === "koth") kothYouDash(); }
    return;
  }
  if (type === "down") {
    if (game === "pitch" && pitch) {
      const owner = pitch.humans === 2 && !Net.online ? (ev.clientX < innerWidth / 2 ? 0 : 1) : 0;
      if (![...sticks.values()].some(s => s.owner === owner)) stickStart(ev, owner);
    } else if (game === "race") {
      if (ev.clientX < innerWidth * 0.55 && ![...sticks.values()].some(s => s.owner === 0)) stickStart(ev, 0); else raceJump();
    } else if (game === "koth") {
      if (ev.clientX < innerWidth * 0.45 && ![...sticks.values()].some(s => s.owner === 0)) stickStart(ev, 0); else kothYouDash();
    } else if (game === "splat") {
      if (ev.clientX < innerWidth * 0.45 && ![...sticks.values()].some(s => s.owner === 0)) stickStart(ev, 0); else splatShootAt(ev);
    }
  } else if (type === "move") stickMove(ev);
  else stickEnd(ev);
}

// GAME MAKER: a game = one of the games + your pick of twists + (optionally) your Workshop arena + a name.
// Saved games sit on the home shelf under "Your games"; a share code carries the whole thing.

const CUSTOM_KEY = "tba-custom";
function loadCustoms() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]"); } catch (e) { return []; } }
function saveCustoms(list) { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); } catch (e) {} }
const CUSTOM_TINTS = ["#ff8a3d", "#2fa8ff", "#ff4fa0", "#8a5cff", "#3fbf55", "#ffd23f"];
function encodeGame(def) { return "TBA1-" + btoa(unescape(encodeURIComponent(JSON.stringify({ n: def.name, g: def.game, t: def.twists, a: def.arena || null })))); }
function decodeGame(code) {
  code = (code || "").trim();
  if (!code.startsWith("TBA1-")) throw new Error("Game codes start with TBA1-");
  let o; try { o = JSON.parse(decodeURIComponent(escape(atob(code.slice(5))))); } catch (e) { throw new Error("This code is cut off. Copy the whole thing."); }
  if (!GAMES[o.g]) throw new Error("This code is for a game this version doesn't have yet.");
  return { name: String(o.n || "Friend's game").slice(0, 30), game: o.g, twists: (o.t || []).filter(id => TWISTS.some(t => t.id === id)), arena: o.a || null };
}
