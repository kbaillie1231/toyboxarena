// ---------------------------------------------------------------------------
// Input: tap to build, drag-back from the ball to putt, otherwise orbit the camera.
// Our pointer listener is registered BEFORE OrbitControls so it can switch orbiting off mid-gesture.
// ---------------------------------------------------------------------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null, aiming = null;

// Point the raycaster where a finger touched. Taps from the other iPad (Play Together) carry their own ray.
function rayFromEvent(ev) {
  if (ev.ray) { ray.ray.origin.set(ev.ray[0], ev.ray[1], ev.ray[2]); ray.ray.direction.set(ev.ray[3], ev.ray[4], ev.ray[5]); return; }
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function groundHit(ev, height) {
  rayFromEvent(ev);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -height), hit = new THREE.Vector3();
  return ray.ray.intersectPlane(plane, hit) ? [hit.x, -hit.z] : null;
}
function cellUnder(ev) {
  // Try the raised levels first so stacked tiles are easy to tap.
  for (const h of [2 + TOP, 1 + TOP, TOP]) {
    const g = groundHit(ev, h); if (!g) continue;
    const [x, y] = toCell(g[0], g[1]);
    if (x < 0 || y < 0 || x >= W || y >= H) continue;
    const p = grid.get(key(x, y));
    if ((p && Math.abs(p.lvl + TOP - h) < 0.01) || h === TOP) return [x, y];
  }
  return null;
}

const canvas = renderer.domElement;
canvas.addEventListener("pointerdown", ev => {
  if (Net.mirror) { guestPointer("down", ev); return; }
  if (Net.online && !(ev.remote ? remoteMay() : localMay())) { if (ev.remote) ev.stopImmediatePropagation(); return; }
  if (ev.remote) ev.stopImmediatePropagation(); // keep remote taps away from the host's camera controls
  if (mode === "play" && game === "fish") { fishPointer("down", ev); return; }
  if (mode === "play" && isAvatarGame()) { avatarPointer("down", ev); return; }
  down = { x: ev.clientX, y: ev.clientY, t: performance.now(), id: ev.pointerId };
  if (mode === "play" && (game === "golf" || (game === "bowl" && bowl && bowl.phase === "aim")) && !shotLive && players[turn] && !players[turn].done) {
    const b = players[turn].ball, g = groundHit(ev, b.z);
    if (g && Math.hypot(g[0] - b.x, g[1] - b.y) < 1.8) {
      aiming = { start: g, cur: g };
      controls.enabled = false;
      if (!ev.remote) canvas.setPointerCapture(ev.pointerId);
    }
  }
});
canvas.addEventListener("pointermove", ev => {
  if (Net.mirror) { guestPointer("move", ev); return; }
  if (Net.online && !(ev.remote ? remoteMay() : localMay())) { if (ev.remote) ev.stopImmediatePropagation(); return; }
  if (ev.remote) ev.stopImmediatePropagation(); // keep remote taps away from the host's camera controls
  if (mode === "play" && game === "fish") { fishPointer("move", ev); return; }
  if (mode === "play" && isAvatarGame()) { avatarPointer("move", ev); return; }
  if (aiming) { const b = players[turn].ball, g = groundHit(ev, b.z); if (g) aiming.cur = g; return; }
  if (mode === "build" && ev.pointerType === "mouse") {
    const c = cellUnder(ev);
    cursor.visible = !!c;
    if (c) { const [px, py] = cellCenter(c[0], c[1]); cursor.position.set(px, toolLvl + 0.03, -py); }
  }
});
canvas.addEventListener("pointerup", ev => {
  if (Net.mirror) { guestPointer("up", ev); return; }
  if (Net.online && !(ev.remote ? remoteMay() : localMay())) { if (ev.remote) ev.stopImmediatePropagation(); return; }
  if (ev.remote) ev.stopImmediatePropagation(); // keep remote taps away from the host's camera controls
  if (mode === "play" && game === "fish") { fishPointer("up", ev); return; }
  if (mode === "play" && isAvatarGame()) { avatarPointer("up", ev); return; }
  if (aiming) {
    const [dx, dy] = [aiming.start[0] - aiming.cur[0], aiming.start[1] - aiming.cur[1]];
    const len = Math.hypot(dx, dy), power = Math.min(MAX_SHOT * SHOT_MULT, len * 3.2 * SHOT_MULT);
    aiming = null; controls.enabled = true; aimGroup.visible = false;
    if (power > 0.4) { if (game === "bowl") bowlRoll(dx / len, dy / len, power); else shoot(dx / len, dy / len, power); }
    return;
  }
  if (!down) return;
  const moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y), quick = performance.now() - down.t < 450;
  down = null;
  if (mode === "build" && moved < 10 && quick) {
    const c = cellUnder(ev); if (c) buildTap(c[0], c[1]);
  }
  if (mode === "play" && (game === "blast" || game === "rush") && moved < 14 && quick) {
    const t = blastAimPoint(ev); if (t) fireAt(t);
  }
});
canvas.addEventListener("pointercancel", (ev) => { if (Net.mirror) { guestPointer("up", ev); return; } if (isAvatarGame()) avatarPointer("up", ev); aiming = null; down = null; if (!(mode === "play" && isAvatarGame())) controls.enabled = true; aimGroup.visible = false; });

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.44;
controls.minDistance = 6; controls.maxDistance = 45;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

function buildTap(x, y) {
  const p = grid.get(key(x, y));
  if (tool === "erase") { if (p) removePiece(x, y); }
  else if (p && p.type === tool && p.lvl === toolLvl) setPiece(tool, x, y, p.lvl, (p.rot + 1) % 4); // tap again = rotate
  else {
    if (tool === "start") for (const q of [...grid.values()]) if (q.type === "start") removePiece(q.x, q.y); // only one tee
    setPiece(tool, x, y, toolLvl, toolRot);
  }
  par = null; // edited by hand, so the computed par no longer applies
  save(); renderHud();
}

// Aim arrow
const aimGroup = new THREE.Group();
const aimMat = new THREE.MeshBasicMaterial({ color: "#ffffff" });
const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.03, 1), aimMat);
const head = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 16), aimMat);
head.rotation.x = -Math.PI / 2;
aimGroup.add(shaft, head); aimGroup.visible = false; scene.add(aimGroup);

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
function toast(msg) {
  if (hostSync) Net.send({ t: "toast", msg });
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1400);
}

function setMode(m) {
  mode = m;
  board.visible = m === "build"; cursor.visible = false;
  controls.enabled = !(m === "play" && (isAvatarGame() || game === "bowl" || game === "fish")); // these games steer the camera themselves
  showBeach(game === "fish" && m !== "build");
  kerbsDirty = true;
  const off = camera.position.clone().sub(controls.target);
  const shooter = game === "blast" || game === "rush";
  blaster.visible = m === "play" && shooter;
  if (m === "build" || m === "preview") { stopAvatarGames(); stopBowl(); stopFish(); }
  if (m === "build") { if (blast) for (const s of blast.shots) scene.remove(s.mesh); blast = null; clearRobots(); rush = null; }
  if (m === "play" && shooter) { // stand behind the blaster, looking out over the range
    // Look at the middle of the targets from behind and above the tee, far enough to see them all.
    const st = findStart(), [sx, sy] = cellCenter(st.x, st.y), pts = game === "rush" && rush ? rush.path : targetPieces().map(p => cellCenter(p.x, p.y));
    const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length, my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    controls.target.set(mx, 0.5, -my);
    const back = new THREE.Vector3(sx - mx, 0, -(sy - my));
    if (back.length() < 1) back.set(0, 0, 1);
    const portrait = innerWidth < innerHeight;
    back.setLength(back.length() + (portrait ? 9 : 9));
    camera.position.copy(controls.target).add(back).add(new THREE.Vector3(0, portrait ? 17 : 14, 0));
    barrelPivot.rotation.y = Math.atan2(-(mx - sx), my - sy); // barrel faces the range
  } else if (m === "play") { // move in closer for putting
    if (off.length() > 16) camera.position.copy(controls.target).add(off.setLength(16));
  } else if (m === "preview" && game === "fish") { // look out from the beach
    controls.target.set(0, 0.5, -20); camera.position.set(3, 6, 4);
  } else if (m === "preview" && grid.size) { // frame this arena behind the lobby card
    const ps = [...grid.values()].map(p => cellCenter(p.x, p.y));
    const mx = ps.reduce((a, p) => a + p[0], 0) / ps.length, my = ps.reduce((a, p) => a + p[1], 0) / ps.length;
    controls.target.set(mx, 0, -my);
    camera.position.copy(controls.target).add(off.setLength(innerWidth < innerHeight ? 23 : 18));
  } else { // back out to see the whole board, keeping the viewing angle
    controls.target.set(0, 0, 0);
    camera.position.copy(off.setLength(innerWidth < innerHeight ? 36 : 24));
  }
  for (const pl of players) pl.mesh.visible = m === "play" && !pl.picked;
  renderHud();
}

function renderHud() {
  const top = $("topRight"), bottom = $("bottom");
  $("gameTitle").innerHTML = mode === "build" ? "Workshop <small>build an arena</small>"
    : `${GAMES[game].name}${activeTwists.length ? ` <small>${activeTwists.map(t => t.name).join(" · ")}</small>` : ""}`;
  if (mode === "preview") { top.innerHTML = ""; bottom.innerHTML = ""; return; }
  const chips = (val) => `<div class="scores">${players.map((p, k) =>
    `<div class="chip ${k === turn && !p.done ? "turn" : ""} ${p.done ? "done" : ""}"><b style="background:${PLAYER_COLORS[p.i]};box-shadow:inset 0 0 0 2px #1d2b3a22"></b>${val(p)}</div>`).join("")}</div>`;
  const hint = (t) => `<div class="hint" style="color:#fff;text-shadow:0 1px 2px #0005">${t}</div>`;

    return;
  }

    const cur = players[turn], secs = koth ? Math.max(0, Math.ceil(koth.timeLeft)) : 0;
    bottom.innerHTML = `<div class="bar" style="flex-direction:column"><div class="panel" style="font-weight:700;font-variant-numeric:tabular-nums">${cur ? `${players.length > 1 ? esc(PLAYER_NAMES[cur.i]) + " · " : ""}0:${String(secs).padStart(2, "0")} · 👑 ${cur.score.toFixed(1)}s on top` : ""}</div>${hint("Left thumb: run · tap right side: dash and shove")}</div>`;
    return;
  }
  if (mode === "play" && game === "fish") {
    top.innerHTML = chips(p => `${p.score} 🐟`);
    const cur = players[turn], f = fish, secs = f ? Math.max(0, Math.ceil(f.timeLeft)) : 0;
    const clock = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
    let line = "Drag back and let go to cast", extra = "";

    if (f && f.state === "show") line = "Got one!";

      const pct = Math.round(Math.min(1, f.tension) * 100), col = pct > 80 ? "var(--warn)" : pct > 55 ? "#ffb02e" : "var(--go)";
      line = `Hold to reel · let go when it's red · ${Math.max(0, f.dist).toFixed(0)} m`;
      extra = `<div class="panel" style="width:min(320px,80vw);padding:6px"><div style="height:16px;border-radius:8px;background:#e6edf3;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col};border-radius:8px"></div></div></div>`;
    }
    bottom.innerHTML = `<div class="bar" style="flex-direction:column">${extra}<div class="panel" style="font-weight:700;font-variant-numeric:tabular-nums">${cur ? `${players.length > 1 ? esc(PLAYER_NAMES[cur.i]) + " · " : ""}${clock} · ${cur.score} fish` : ""}</div>${hint(line)}</div>`;
    return;
  }
  if (mode === "play" && game === "splat") {
    top.innerHTML = chips(p => p.score);
    const cur = players[turn], secs = splat ? Math.max(0, Math.ceil(splat.timeLeft)) : 0;
    bottom.innerHTML = `<div class="bar" style="flex-direction:column"><div class="panel" style="font-weight:700;font-variant-numeric:tabular-nums">${cur ? `${players.length > 1 ? PLAYER_NAMES[cur.i] + " · " : ""}0:${String(secs).padStart(2, "0")} · ${cur.score} splats` : ""}</div>${hint("Left thumb: run · tap: throw")}</div>`;
    return;
  }
  if (mode === "play" && game === "race") {
    top.innerHTML = chips(p => p.time != null ? fmtTime(p.time) : p.done ? "DNF" : "–");
    const cur = players[turn];
    bottom.innerHTML = `<div class="bar" style="flex-direction:column;width:100%"><div class="panel" style="font-weight:700;font-variant-numeric:tabular-nums">${cur ? `${players.length > 1 ? PLAYER_NAMES[cur.i] + " · " : ""}${fmtTime(race ? race.t : 0)}` : ""}</div>${hint("Left thumb: run · right side: jump")}</div>
      <button id="jumpBtn" aria-label="Jump" style="position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(26px + env(safe-area-inset-bottom, 0px));width:96px;height:96px;border-radius:50%;border:0;background:#ffd23f;color:#1d2b3a;font:400 22px var(--display);box-shadow:0 5px 0 #c9a21c;pointer-events:auto">Jump</button>`;
    const jb = $("jumpBtn"); jb.addEventListener("pointerdown", (e) => { e.preventDefault(); raceJump(); });
    return;
  }
  if (mode === "play" && game === "pitch") {
    top.innerHTML = pitch ? `<div class="scores"><div class="chip"><b style="background:${TEAM[0].color}"></b>${pitch.score[0]}</div><div class="chip"><b style="background:${TEAM[1].color}"></b>${pitch.score[1]}</div></div>` : "";

    return;
  }
  if (mode === "play" && game === "rush") {
    top.innerHTML = `<div class="scores">${players.map((p, k) =>
      `<div class="chip ${k === turn ? "turn" : ""}"><b style="background:${PLAYER_COLORS[p.i]};box-shadow:inset 0 0 0 2px #1d2b3a22"></b>${p.score}</div>`).join("")}</div>`;
    const cur = players[turn], lives = rush ? Math.max(0, rush.lives) : 0;
    bottom.innerHTML = `<div class="bar" style="flex-direction:column">
      <div class="panel" style="font-weight:700;font-variant-numeric:tabular-nums">${rush ? `Wave ${rush.wave}/${RUSH_WAVES} · <span style="color:var(--warn)" aria-label="${lives} lives">${"♥".repeat(lives)}</span>${players.length > 1 && cur ? ` · ${PLAYER_NAMES[cur.i]} defends` : ""}` : ""}</div>
      <div class="hint" style="color:#fff;text-shadow:0 1px 2px #0005">Tap a robot to blast it · drag to look around</div></div>`;
    return;
  }
  if (mode === "build") {
    const v = validity();
    top.innerHTML = `<div class="panel check" aria-live="polite">
      <span class="${v.starts === 1 ? "ok" : ""}">1 tee</span>
      <span class="${v.goals >= 1 ? "ok" : ""}" title="Needed for mini-golf">hole</span>
      <span class="${v.targets >= 1 ? "ok" : ""}" title="Needed for Target Blast">target</span>
      <span class="ok" style="font-variant-numeric:tabular-nums">${grid.size}/${PIECE_BUDGET}</span></div>`;
    bottom.innerHTML = `<div class="bar" style="width:100%;flex-direction:column;gap:8px">
      <div class="bar">
        <button class="btn" id="rotBtn" aria-label="Rotate new pieces">↻ Turn ${["N", "W", "S", "E"][toolRot]}</button>
        <button class="btn" id="lvlBtn" aria-label="Height of new pieces">▲ Height ${toolLvl}</button>
        <button class="btn" id="moreBtn">Arena…</button>
        <button class="btn primary" id="goBtn">Play ▸</button>
      </div>
      <div class="palette" role="toolbar" aria-label="Pieces">
        ${TYPES.map(t => `<button class="slot" data-t="${t}" aria-pressed="${tool === t}"><i style="background:${SWATCH[t]}"></i>${LABEL[t]}</button>`).join("")}
        <span class="sep"></span>
        <button class="slot tool" data-t="erase" aria-pressed="${tool === "erase"}"><i style="background:#fff;box-shadow:inset 0 0 0 3px var(--warn)"></i>Erase</button>
      </div>
      <div class="hint">Tap a square to place · tap the same piece again to turn it · drag to look around</div></div>`;
    bottom.querySelectorAll(".slot").forEach(b => b.onclick = () => { tool = b.dataset.t; renderHud(); });
    $("rotBtn").onclick = () => { toolRot = (toolRot + 1) % 4; renderHud(); };
    $("lvlBtn").onclick = () => { toolLvl = (toolLvl + 1) % 3; renderHud(); };
    $("goBtn").onclick = askPlayers;
    $("moreBtn").onclick = arenaSheet;
  } else if (game === "blast") {
    top.innerHTML = `<div class="scores">${players.map((p, k) =>
      `<div class="chip ${k === turn && !p.done ? "turn" : ""} ${p.done ? "done" : ""}"><b style="background:${PLAYER_COLORS[p.i]};box-shadow:inset 0 0 0 2px #1d2b3a22"></b>${p.score}</div>`).join("")}</div>`;
    const cur = players[turn], secs = blast ? Math.max(0, Math.ceil(blast.timeLeft)) : 0;
    bottom.innerHTML = `<div class="bar" style="flex-direction:column">
      <div class="panel" style="font-weight:700;font-variant-numeric:tabular-nums">${cur ? `${players.length > 1 ? PLAYER_NAMES[cur.i] + " · " : ""}0:${String(secs).padStart(2, "0")} · ${cur.score} pts` : ""}</div>
      <div class="hint" style="color:#fff;text-shadow:0 1px 2px #0005">Tap a target to blast it · drag to look around</div></div>`;
  } else {
    top.innerHTML = `<div class="scores">${players.map((p, k) =>
      `<div class="chip ${k === turn && !p.done ? "turn" : ""} ${p.done ? "done" : ""}"><b style="background:${PLAYER_COLORS[p.i]};box-shadow:inset 0 0 0 2px #1d2b3a22"></b>${p.strokes}${p.done && !p.picked ? " ✓" : ""}</div>`).join("")}</div>`;
    const cur = players[turn];
    bottom.innerHTML = `<div class="bar" style="flex-direction:column">
      <div class="panel" style="font-weight:700">${cur && !cur.done ? `${players.length > 1 ? PLAYER_NAMES[cur.i] + " · " : ""}stroke ${cur.strokes + 1}${par ? ` · par ${par}` : ""}` : ""}</div>
      <div class="hint" style="color:#fff;text-shadow:0 1px 2px #0005">Drag back from your ball and let go to putt</div></div>`;
  }
}

function sheet(html, wire) {
  const host = $("sheetHost");
  host.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="panel pop">${html}</div></div>`;
  const close = () => host.innerHTML = "";
  // Only menu-style sheets close when you tap outside them; game cards (lobby, rules, results, waves) never do,
  // otherwise a stray tap leaves you on an empty screen. Taps in the first 400 ms are ignored either way.
  const opened = performance.now(), dismissable = html.includes("data-dismissable");
  host.querySelector(".sheet").addEventListener("click", e => { if (dismissable && performance.now() - opened > 400 && e.target.classList.contains("sheet")) close(); });
  wire(host, close);
}

// ===========================================================================
// PLAY TOGETHER: two iPads, one game. The host's iPad runs the match and sends the state ~20×/s;
// the other iPad sends its joystick and draws what the host sends. Transport today: nearby iPads
// (MultipeerConnectivity in NearbyNet.swift). The same messages can ride an internet relay later.
// In a browser, add #loopback to the URL to test with two tabs (BroadcastChannel).
// ===========================================================================
const NAME_KEY = "tba-name";
function myName() { try { return (localStorage.getItem(NAME_KEY) || "").trim().slice(0, 20); } catch (e) { return ""; } }
function setMyName(n) { try { localStorage.setItem(NAME_KEY, n.trim().slice(0, 20)); } catch (e) {} }
const nameOrDefault = () => myName() || "Player";

const Net = {
  native: !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.net),
  loop: location.hash === "#loopback" && "BroadcastChannel" in window,
  role: null, connected: false, peerName: "", rooms: [], remoteInput: [0, 0], lastState: null, sendT: 0,
  transport: "nearby", // "nearby" (iPads next to each other) or "online" (far-away friends)
  get available() { return this.native || this.loop || onlineCapable(); },
  post(op, extra = {}) {
    if (op === "stop") { if (this.native) window.webkit.messageHandlers.net.postMessage({ op }); if (this.loop) loopPost(op, extra); onlinePost(op, extra); return; }
    if (this.transport === "online") onlinePost(op, extra);
    else if (this.native) window.webkit.messageHandlers.net.postMessage({ op, ...extra });
    else if (this.loop) loopPost(op, extra);
  },
  send(msg, reliable = true) { if (this.connected) this.post("send", { data: JSON.stringify(msg), reliable }); },
  stop() { this.post("stop"); this.role = null; this.connected = false; this.peerName = ""; this.rooms = []; if (typeof netCleanup === "function") netCleanup(); },
};
window.NetBridge = { _in(ev) { netEvent(ev); } };

// --- Loopback transport (browser testing only) ---
let loopBC = null, loopId = Math.random().toString(36).slice(2), loopAdvert = null, loopPeer = null;
function loopPost(op, x) {
  if (!loopBC) {
    loopBC = new BroadcastChannel("tba-net");
    loopBC.onmessage = (e) => {
      const m = e.data; if (m.from === loopId) return;
      if (m.k === "advert" && Net.role === "browse") {
        if (!Net.rooms.some(r => r.id === m.from)) { Net.rooms.push({ id: m.from, name: m.name, code: m.code, game: m.game }); netEvent({ type: "rooms", rooms: Net.rooms }); }
      } else if (m.k === "invite" && m.to === loopId && loopAdvert) {
        loopPeer = m.from; clearInterval(loopAdvert); loopAdvert = null;
        loopBC.postMessage({ k: "accept", from: loopId, to: m.from, name: Net._loopName }); // the host tells the guest its own name
        netEvent({ type: "peer", state: "connected", name: m.name });
      } else if (m.k === "accept" && m.to === loopId) { loopPeer = m.from; netEvent({ type: "peer", state: "connected", name: m.name }); }
      else if (m.k === "data" && m.to === loopId) netEvent({ type: "msg", data: m.data });
      else if (m.k === "bye" && m.to === loopId) { loopPeer = null; netEvent({ type: "peer", state: "notConnected", name: "" }); }
    };
  }
  if (op === "host") { Net._loopName = x.name; loopAdvert = setInterval(() => loopBC.postMessage({ k: "advert", from: loopId, name: x.name, code: x.code, game: x.game }), 300); }
  else if (op === "browse") { Net._loopName = x.name; }
  else if (op === "join") loopBC.postMessage({ k: "invite", from: loopId, to: x.id, name: Net._loopName, myName: Net._loopName });
  else if (op === "send" && loopPeer) loopBC.postMessage({ k: "data", from: loopId, to: loopPeer, data: x.data });
  else if (op === "stop") { if (loopPeer) loopBC.postMessage({ k: "bye", from: loopId, to: loopPeer }); loopPeer = null; clearInterval(loopAdvert); loopAdvert = null; }
}

// --- Online transport (far-away friends): WebRTC through PeerJS. The free PeerJS server only introduces
// the two devices (by room code); game data then flows directly device-to-device, encrypted.
const ONLINE_PREFIX = "toyboxarena-";
const Online = { peer: null, conn: null };
const onlineCapable = () => typeof window.Peer === "function" && "RTCPeerConnection" in window;
function onlineSetup(c) {
  Online.conn = c;
  c.on("open", () => c.send({ k: "hello", name: Net.myName || nameOrDefault() }));
  c.on("data", (d) => {
    if (!d || typeof d !== "object") return;
    if (d.k === "hello") netEvent({ type: "peer", state: "connected", name: String(d.name || "Friend").slice(0, 20) });
    else if (d.k === "data") netEvent({ type: "msg", data: d.data });
  });
  c.on("close", () => { if (Online.conn === c) { Online.conn = null; netEvent({ type: "peer", state: "notConnected", name: "" }); } });
  c.on("error", () => {});
}
function onlineError(e) {
  const t = e && e.type;
  const text = t === "peer-unavailable" ? "No game with that code. Check the letters and make sure your friend is still hosting."
    : t === "unavailable-id" ? "That code is taken. Tap Cancel and host again for a new one."
    : t === "network" || t === "server-error" || t === "socket-error" ? "Can't reach the internet. Check Wi-Fi and try again."
    : t === "browser-incompatible" ? "This browser can't play online. Try Safari or Chrome."
    : "Couldn't connect. Try again.";
  netEvent({ type: "error", text });
}
function onlinePost(op, x) {
  if (op === "host") {
    Online.peer = new Peer(ONLINE_PREFIX + x.code.toLowerCase());
    Online.peer.on("connection", (c) => { if (Online.conn) { c.close(); return; } onlineSetup(c); }); // one friend at a time
    Online.peer.on("error", onlineError);
  } else if (op === "join") {
    Online.peer = new Peer();
    Online.peer.on("open", () => onlineSetup(Online.peer.connect(ONLINE_PREFIX + x.id.toLowerCase(), { reliable: true })));
    Online.peer.on("error", onlineError);
  } else if (op === "send") {
    if (Online.conn && Online.conn.open) Online.conn.send({ k: "data", data: x.data });
  } else if (op === "stop") {
    const c = Online.conn; Online.conn = null;
    try { if (c) c.close(); } catch (e) {}
    try { if (Online.peer) Online.peer.destroy(); } catch (e) {}
    Online.peer = null;
  }
}

function netEvent(ev) {
  if (ev.type === "rooms") { Net.rooms = ev.rooms || []; renderRoomList(); }
  else if (ev.type === "peer") {
    if (ev.state === "connected") {
      Net.connected = true; Net.peerName = ev.name || "Friend";
      if (Net.role === "host") togetherHostReady(); else togetherGuestReady();
    } else if (ev.state === "notConnected" && Net.connected) {
      Net.connected = false;
      toast(`${Net.peerName || "Your friend"} left`);

  else if (kind === "splat") { loadList(randomPlaygroundLayout()); rebuildKerbs(); par = null; }
  else if (kind === "race") { loadList(randomRaceLayout()); rebuildKerbs(); par = null; }
  else if (kind === "pitch") { loadList(randomPitchLayout()); rebuildKerbs(); par = null; }
  else if (kind === "bowl") { loadList(randomBowlLayout()); rebuildKerbs(); par = null; }
  else if (kind === "koth") { loadList(randomHillLayout()); kerbsDirty = true; par = null; }

  });
}

// Random Game: a random game type + 1–2 random rule twists + a random arena, revealed on a rule card.
const EXCLUSIVE = [["giant", "tiny"]];
function rollTwists(kind) {
  const pool = TWISTS.filter(t => t.games.includes(kind)), out = [];
  const n = Math.random() < 0.55 ? 2 : 1;
  while (out.length < n && pool.length) {
    const t = pool.splice(rint(0, pool.length - 1), 1)[0];
    if (EXCLUSIVE.some(g => g.includes(t.id) && out.some(o => g.includes(o.id)))) continue;
    out.push(t);
  }
  return out;
}
const SHORT = { golf: "Golf", blast: "Blast", rush: "Robot Rush", splat: "Splat Tag", race: "Race", pitch: "Pitch Ball", bowl: "Bowling", koth: "Hill", fish: "Fishing" };
function rollRandomGame() {
  transition(() => {
    stopEverything(); showHome(false);
    const kinds = Object.keys(GAMES), kind = kinds[rint(0, kinds.length - 1)];
    const twists = rollTwists(kind);
    applyTwists(twists); // before the arena, so random holes are bot-checked under these rules
    randomArenaFor(kind, false);
    setMode("preview");
    ruleCard(kind, twists);
  });
}
function ruleCard(kind, twists) {
  const title = `${twists.map(t => t.word).join(" ")} ${SHORT[kind]}`;
  sheet(`<p style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px">Random game</p>
    <h2>${title}</h2>
    <p>${GAME_HOWTO[kind]}${kind === "golf" && par ? ` Par ${par}.` : ""}</p>
    <div class="rules">${twists.map(t => `<div class="rule"><i style="background:${t.color}">${t.name[0]}</i><div><b>${t.name}</b><span>${typeof t.desc === "string" ? t.desc : t.desc[kind]}</span></div></div>`).join("")}</div>
    <p style="font-weight:700;color:var(--ink)">Players</p>
    ${playersPicker()}
    <button class="btn primary" id="rcPlay" style="font-size:18px;padding:12px">Play</button>
    <div class="bar"><button class="btn" id="rcReroll">Roll again</button><button class="btn" id="rcHome">All games</button></div>`, (h, close) => {
    wirePlayersPicker(h);
    h.querySelector("#rcPlay").onclick = () => { close(); startPlay(); };
    h.querySelector("#rcReroll").onclick = () => { close(); rollRandomGame(); };
    h.querySelector("#rcHome").onclick = () => { close(); goHome(); };
  });
}

function renderHomePlayers() {
  $("homePlayers").innerHTML = [1, 2, 3, 4].map(n => `<button data-n="${n}" aria-pressed="${n === playerCount}" aria-label="${n} player${n > 1 ? "s" : ""}">${n}</button>`).join("");

}

const DICE_DOTS = [[[50, 50]], [[28, 28], [72, 72]], [[26, 26], [50, 50], [74, 74]], [[28, 28], [72, 28], [28, 72], [72, 72]], [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]]];
const die = (n) => `<i>${DICE_DOTS[n - 1].map(([x, y]) => `<b style="left:calc(${x}% - 6.5px);top:calc(${y}% - 6.5px)"></b>`).join("")}</i>`;
function renderHomeName() {

function renderHome() {
  renderHomePlayers(); renderHomeName();
  $("shelf").innerHTML = GAME_CARDS.map(c => `
    <button class="gcard" data-id="${c.id}" style="--tint:${c.tint}">

        ${c.id === "maker" ? `<div class="dice"><div style="width:58%;background:#fff;border-radius:16px;padding:14px;display:grid;gap:8px;transform:rotate(-4deg);box-shadow:0 6px 0 rgba(0,0,0,.2)">${["#ff8a3d", "#2fa8ff", "#3fbf55"].map((c, i) => `<span style="display:flex;gap:8px;align-items:center"><i style="width:22px;height:22px;border-radius:7px;background:${c};display:block"></i><b style="height:10px;border-radius:5px;background:#dde6ee;flex:1;max-width:${70 - i * 15}%"></b></span>`).join("")}</div></div>` : ""}

    else if (id === "workshop") openWorkshop();
    else if (id === "maker") openGameMaker();
    else if (id === "together") openTogether();

  });
  // Your games (made in the Game Maker)
  const customs = loadCustoms();
  $("customWrap").hidden = customs.length === 0;
  $("shelfCustom").innerHTML = customs.map(c => `
    <div class="gcard" style="--tint:${c.tint || "#8a5cff"}" data-cid="${c.id}" role="button" tabindex="0">
      <div class="art" style="display:grid;place-items:center">
        <span class="tag">${GAMES[c.game] ? GAMES[c.game].name : "Game"}</span>
        <span style="font:400 30px var(--display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);padding:0 16px;text-align:center">${c.name.replace(/</g, "&lt;")}</span>
        <button class="btn" data-del="${c.id}" aria-label="Delete ${c.name.replace(/"/g, "")}" style="position:absolute;right:10px;top:10px;padding:2px 10px">✕</button>
      </div>
      <div class="meta"><h3>${c.name.replace(/</g, "&lt;")}</h3><p>${c.twists.length ? c.twists.map(id => (TWISTS.find(t => t.id === id) || {}).name).filter(Boolean).join(" · ") : "Normal rules"}</p></div>
    </div>`).join("");
  $("shelfCustom").querySelectorAll(".gcard").forEach(card => card.onclick = (e) => {
    const del = e.target.closest("[data-del]");
    if (del) { // tap ✕ twice to delete
      e.stopPropagation();
      if (del.dataset.armed) { saveCustoms(loadCustoms().filter(c => c.id !== del.dataset.del)); renderHome(); }
      else { del.dataset.armed = "1"; del.textContent = "Delete?"; }
      return;
    }
    const def = loadCustoms().find(c => c.id === card.dataset.cid);
    if (def) playCustom(def);
  });
}

// Card art: render each game's arena with the real engine once at startup.
function snapshot(list, extras) {
  loadList(list); rebuildKerbs();
  const added = extras ? extras() : [];
  const xs = list.map(p => cellCenter(p[1], p[2])), mx = xs.reduce((a, p) => a + p[0], 0) / xs.length, my = xs.reduce((a, p) => a + p[1], 0) / xs.length;
  const ext = Math.max(...xs.map(p => Math.hypot(p[0] - mx, p[1] - my))) + 2;
  camera.fov = 40; camera.aspect = 16 / 9; camera.updateProjectionMatrix();
  camera.position.set(mx + ext * 0.45, ext * 0.95, -my + ext * 0.95);
  camera.lookAt(mx, 0.6, -my);
  renderer.setSize(640, 360, false);
  board.visible = false; cursor.visible = false;
  for (const p of grid.values()) { const b = p.obj.userData.board; if (b) b.rotation.x = b.userData.baseX || 0; }
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL("image/jpeg", 0.82);
  for (const o of added) scene.remove(o);
  return url;
}
function makeThumbnails() {
  try {
    thumbs.golf = snapshot(SAMPLE, () => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 14), new THREE.MeshStandardMaterial({ color: "#fff" }));
      const [x, y] = cellCenter(7, 5); m.position.set(x, 1 + TOP + 0.15, -y); m.castShadow = true; scene.add(m); return [m];
    });
    thumbs.blast = snapshot(BLAST_SAMPLE, () => {
      const [x, y] = cellCenter(4, 0); blaster.position.set(x, TOP, -y); blaster.visible = true; blasterMat.color.set("#ffd23f");
      barrelPivot.rotation.y = 0; return [];
    });
    blaster.visible = false;
    thumbs.rush = snapshot(SAMPLE, () => {
      const path = robotPath(), out = [];
      if (!path) return out;
      for (const [k, s] of [[0, 3], [1, 6.5], [2, 10]]) {
        const r = makeRobot(ROBOT_COLORS[k]), [x, y, hd] = pointAlong(path, s);
        r.position.set(x, surfaceAt(x, y) ?? TOP, -y); r.rotation.y = hd; scene.add(r); out.push(r);
      }
      return out;
    });
    // Character games: a figure (and friends) placed on a fresh random arena of that kind
    const placeFig = (color, cell, robot) => {
      const [x, y] = cellCenter(cell.x, cell.y), m = robot ? makeRobot(color) : makeFigure(color);
      m.position.set(x, (surfaceAt(x, y) ?? TOP), -y); m.rotation.y = Math.random() * 6; scene.add(m); return m;
    };
    thumbs.splat = snapshot(randomPlaygroundLayout(), () => {
      const cells = walkableCells(), out = [placeFig(PLAYER_COLORS[1], cells[0])];
      for (let k = 1; k <= 3; k++) out.push(placeFig(ROBOT_COLORS[k], cells[Math.floor(cells.length * k / 4)], true));
      return out;
    });
    thumbs.race = snapshot(randomRaceLayout(), () => {
      const st = findStart(); return st ? [placeFig(PLAYER_COLORS[2], st)] : [];
    });
    thumbs.pitch = snapshot(randomPitchLayout(), () => {
      const b = makeBallMesh(0.45), [x, y] = cellCenter(4, 5); b.position.set(x, TOP + 0.45, -y); scene.add(b);
      return [b, placeFig(TEAM[0].color, grid.get(key(3, 4))), placeFig(TEAM[1].color, grid.get(key(5, 6)))];
    });
    thumbs.bowl = snapshot(randomBowlLayout(), () => {
      const d = pinDeck(), st = findStart(), out = [];
      if (!d || !st) return out;
      const [cx, cy] = cellCenter(d.x, d.y), [sx, sy] = cellCenter(st.x, st.y), l = Math.hypot(cx - sx, cy - sy), fx = (cx - sx) / l, fy = (cy - sy) / l;
      for (let r = 0; r < 4; r++) for (let i = 0; i <= r; i++) {
        const pin = makePin(), along = r * 0.27 - 0.4, side = (i - r / 2) * 0.3;
        pin.position.set(cx + fx * along + fy * side, d.lvl + TOP, -(cy + fy * along - fx * side)); scene.add(pin); out.push(pin);
      }
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 14), new THREE.MeshStandardMaterial({ color: "#2f3e9e", roughness: 0.25 }));
      ball.position.set(sx + fx * 3, (surfaceAt(sx + fx * 3, sy + fy * 3) ?? TOP) + 0.22, -(sy + fy * 3)); ball.castShadow = true; scene.add(ball); out.push(ball);
      return out;
    });
    thumbs.koth = snapshot(randomHillLayout(), () => {
      const top = Math.max(...[...grid.values()].map(p => p.lvl)), crown = [...grid.values()].filter(p => p.lvl === top && p.type !== "ramp");
      const low = [...grid.values()].filter(p => p.lvl === 0);
      return [placeFig(PLAYER_COLORS[1], crown[0]), placeFig(ROBOT_COLORS[0], crown[crown.length - 1], true), placeFig(ROBOT_COLORS[1], low[3], true), placeFig(ROBOT_COLORS[2], low[9], true)];
    });
    // Beach: no tiles, so frame the pier by hand
    clearArena(); showBeach(true); animateBeach(1.2);
    const fisher = makeFigure(PLAYER_COLORS[3]); fisher.position.copy(PIER_END); scene.add(fisher);
    const bob = makeBobber(); bob.position.set(-2.5, 0.1, -22); scene.add(bob);
    const jumper = makeFishMesh("#ffd23f"); jumper.position.set(3.5, 1.4, -18); jumper.rotation.set(0.6, 0.8, 0.4); jumper.scale.setScalar(2.2); scene.add(jumper);
    camera.fov = 40; camera.aspect = 16 / 9; camera.updateProjectionMatrix();
    camera.position.set(4, 5, 1); camera.lookAt(-0.5, 0.4, -16);
    renderer.setSize(640, 360, false); renderer.render(scene, camera);
    thumbs.fish = renderer.domElement.toDataURL("image/jpeg", 0.82);
    for (const o of [fisher, bob, jumper]) scene.remove(o);
    showBeach(false);
    thumbs.workshop = snapshot(SAMPLE.slice(0, 11), () => { board.visible = true; return []; });
    board.visible = false;
  } catch (e) { /* cards fall back to their colour */ }
  resize.done = false; resize();
}

$("homeBtn").onclick = goHome;

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 62 : 45; // portrait phones need a wider view
  camera.updateProjectionMatrix();
  if (!resize.done) { // first frame: frame the whole board, further back on narrow screens
    const d = w < h ? 36 : 24;
    camera.position.set(0.35 * d, 0.75 * d, 0.6 * d);
    resize.done = true;
  }
}
addEventListener("resize", resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; // never negative, never a huge jump
  time += dt;
  if (kerbsDirty) rebuildKerbs();
  for (const p of grid.values()) if (p.obj.userData.arm) p.obj.userData.arm.rotation.y = time * SPIN_W;
  if (Net.mirror) { // Play Together guest: no game logic here, just draw what the host sends
    updateParticles(dt); mirrorFrame(dt); animateBeach(time);
    renderer.render(scene, camera); requestAnimationFrame(frame); return;
  }
  if (hostSync && Net.connected && (hostSync.t -= dt) <= 0) { hostSync.t = 0.05; hostSnapshot(); }

  updateParticles(dt);
  if (mode === "play" && (game === "blast" || game === "rush")) { updateBlast(dt); updateRush(dt); }
  if (mode === "play" && game === "splat") updateSplat(dt);
  if (mode === "play" && game === "race") updateRace(dt);
  if (mode === "play" && game === "pitch") updatePitch(dt);
  if (mode === "play" && game === "bowl") updateBowl(dt);
  if (mode === "play" && game === "koth") updateKoth(dt);
  if (mode === "play" && game === "fish") updateFish(dt);
  animateBeach(time);
  if (!(mode === "play" && (game === "blast" || game === "rush"))) for (const p of grid.values()) { // boards stand up outside the shooters
    const b = p.obj.userData.board;
    if (b) b.rotation.x += ((b.userData.baseX || 0) - b.rotation.x) * Math.min(1, dt * 10);
  }

  if (mode === "play" && game === "golf" && players.length) {
    const SUB = 8, h = dt / SUB;
    for (let s = 0; s < SUB; s++) {
      for (const pl of players) step(pl.ball, h);
      for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) ballsCollide(players[i].ball, players[j].ball);
    }
    for (const pl of players) {
      const b = pl.ball;
      if (b.sunk && b.sinkT !== undefined && b.sinkT < 1) { b.sinkT += dt * 3; b.x += (b.cup[0] - b.x) * 0.3; b.y += (b.cup[1] - b.y) * 0.3; b.z = b.cupZ - b.sinkT * 0.25; }
      pl.mesh.position.set(b.x, b.z + BALL_R, -b.y);
      if (b.grounded && !b.sunk) { pl.mesh.rotation.x -= b.vy * dt / BALL_R; pl.mesh.rotation.z -= b.vx * dt / BALL_R; }
    }
    if (shotLive && players.every(p => atRest(p.ball))) afterShot();

    // Camera follows whoever is putting (or the moving ball), keeping the orbit angle the player chose.
    const focus = players[turn] && players[turn].ball;
    if (focus && !aiming) {
      const tgt = new THREE.Vector3(focus.x, focus.z, -focus.y), delta = tgt.sub(controls.target).multiplyScalar(Math.min(1, dt * 2.5));
      controls.target.add(delta); camera.position.add(delta);
    }

    if (aiming) {
      const b = players[turn].ball, dx = aiming.start[0] - aiming.cur[0], dy = aiming.start[1] - aiming.cur[1];
      const len = Math.hypot(dx, dy), power = Math.min(MAX_SHOT * SHOT_MULT, len * 3.2 * SHOT_MULT), L = 0.4 + power * 0.28;
      aimGroup.visible = power > 0.4;
      if (len > 0) {
        aimGroup.position.set(b.x, b.z + 0.05, -b.y);
        aimGroup.rotation.y = Math.atan2(-dx, dy); // local -Z onto world (dx, -dy)
        shaft.scale.z = L; shaft.position.z = -L / 2 - BALL_R; head.position.z = -L - BALL_R - 0.2;
        aimMat.color.setHSL(0.33 - 0.33 * (power / (MAX_SHOT * SHOT_MULT)), 0.9, 0.55);
      }
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Boot: render the card art, then open on the home shelf with the sample hole idling behind it.
// ---------------------------------------------------------------------------
// On the website, save the game for offline play (skipped inside the iPad app and in previews).

}

  makeThumbnails();
  loadList(SAMPLE); rebuildKerbs(); par = 3;
  mode = "preview"; setMode("preview");
  renderHome(); showHome(true);
  $("loading").remove();
  requestAnimationFrame(frame);
});
